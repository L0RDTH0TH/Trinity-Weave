# Genesis Mythos — API surface v0 (internal / first-party)
# Living classification: Roadmap/Conceptual-Amendments/api-core-protection-inventory.md
# CDR: Roadmap/Conceptual-Decision-Records/api-core-protection-boundary-2026-09-28.md
# Stability: v0 internal only; public versioning deferred to Phase 5 formalization.

api_version: 0
stability: internal_first_party
project_id: genesis-mythos-master

provisional_promotion_rule: >
  Promote a provisional slot to a real versioned port when a first-party flavor
  is required by the exemplar loop or when a pack swap needs it. Until then
  named-only; no direct core reach.

deeper_access_sunset:
  rule: temporary_justified
  by_acceptance: phase_6_4
  disposition: remove_or_promote_to_internal_only_port
  public_path: api_only

capability_verbs:
  - id: register
    meaning: Bind a module or pack to a published port
  - id: observe
    meaning: Read events or query surfaces without mutation
  - id: request
    meaning: Ask core for a capability; core may refuse
  - id: propose
    meaning: >
      Submit a candidate change (canon, re-gen, overwrite, etc.).
      Always gated by ConflictArbiter, NarrativeDeltaVetoPolicy, and
      overwrite/re-gen paths. Never a direct mutate of protected state.
    direct_mutate: false
    gates:
      - ConflictArbiter
      - NarrativeDeltaVetoPolicy
      - DMOverwriteClass
      - ReGenerationIntentQueue

protected_invariants:
  - id: dual_perspective_authority
    summary: Player FP baseline + DM WorldCam/MapCam/SensoriumAttach authority not replaceable by modules
  - id: agency_envelope_authority
    summary: Who may issue intents is rules/session-bound; modules cannot bypass AgencyEnvelope
  - id: sim_tick_ownership
    summary: SimClock / SimTickPipeline / WorldStateCommitter / DMPauseGate owned by core
  - id: regen_overwrite_policy
    summary: Structural re-gen and overwrite classes owned by core; modules propose only
  - id: canon_commit_gate
    summary: CanonCommitBoundary lifecycle proposed→accepted→hooked→sim-active owned by core
  - id: rule_effect_bus_ownership
    summary: Plugins subscribe to RuleEffectBus; they do not own the bus

