does_not_mandate:
- every backstory forces a mid-game reunion ordeal
- legacies are DM-only lore with no player surface
- system auto-weaves hooks without DM accept
- one identity-pact skin is the product default for legacies
- players may auto-write world canon from backstory without DM gate
alternatives_not_banned:
- Sparse vs dense seeding
- Mostly social recognition vs mechanical claims (land, title, blood debt)
- Early-only seeding vs ongoing personal stakes added later
- Quiet chronicle-only persistence vs loud in-play callbacks
- One-campaign binding of a legacy vs legacies that can travel into a later campaign
  in the same world
- Minimal vs richer player-lite chronicle chrome later
