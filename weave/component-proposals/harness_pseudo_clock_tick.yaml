id: harness_pseudo_clock_tick
conceptual:
  outcome: The weave keeps a pulse in the background — infrastructure stays aligned,
    synced, and honest while you are not in chat, without starting a full pipeline
    cook.
  summary: 'Headless eat is the chef (lane pipelines). The pseudo-clock is the harness
    heartbeat: the periodic check that the system underneath is still healthy. Implementation
    state often lives under the institute bundle; the role is vault/weave infrastructure
    rhythm — sync windows, board, continuity, hygiene. Counters move; thresholds fire
    small, bounded actions when those rhythms need a nudge.'
  primary_case: 'Cron, daemon, or autopilot fires one tick. You did not ask for ingest
    or roadmap in chat; the harness still asks: Is sync allowed in this window? Is
    the board stale? Is the queue depth lying? Should continuity be trimmed? Receipts
    and clock state record what fired — you review when you care.'
  edge_cases:
  - Disabled in config — heartbeat skips; no fake progress.
  - Daemon cycle may run syncthing policy in the same cadence as a tick — same heartbeat
    story, sibling step.
  misread_risks:
  - Treating the heartbeat as a lane pipeline — ticks do not run full dispatch.
  - Expecting a tick to replace headless eat — chef vs pulse.
  - Hand-editing clock counters or .technical sync state — bypasses policy and audit.
  operator_memory_hook: Harness heartbeat — background pulse for weave infra (sync
    windows, board, hygiene), not the chef.
  spine_ordinal: 4
  pairs_with: harness_headless_eat — chef cooks lanes; heartbeat keeps harness/infra
    in rhythm. Often sequenced with harness daemon + syncthing_sync_policy in the
    same background cycle.
