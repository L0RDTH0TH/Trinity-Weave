id: decision_matrix_feedback
conceptual:
  outcome: You get a dependable outcome from decision matrix feedback — without guessing
    from logs alone.
  summary: 'Decision Matrix Feedback exists so everyday operation stays understandable:
    what it protects, when it runs, and what ''done'' feels like for someone who does
    not read the implementation. decision matrix feedback.'
  primary_case: You are about to rely on decision matrix feedback. You should know
    within a minute why it matters, what good looks like, and what would be a dangerous
    misunderstanding — in plain language.
  edge_cases:
  - Session or plan id pasted into narrative — must stand alone for batch generation.
  - Outcome reads like a module docstring — busy operators skim past it.
  - Treating decision matrix feedback as optional when the maintenance board says
    it is due.
  - Pending vs active — registered but not yet enforcing until governance approves
    higher-risk law.
  - No prior records yet — governance initializes baseline memory so future runs have
    continuity.
  - Conflicting signals across lanes — governance records both instead of silently
    flattening disagreements.
  misread_risks:
  - Writing about the documentation system instead of what the person gains.
  - Copying implementation vocabulary into the outcome line.
  - Locking narrative before a human read-through — story drifts from reality.
  - Treating this as an allow list of permitted repairs — that is a different concept.
  - Duplicating shared law on every card instead of referencing the apex.
  - Inventing forbidden logic in chat because it feels faster than registering law.
  - Confusing shared law with save-point integrity — different layers of honesty.
  - Thinking bootstrap seeds define the whole concept — they seed members; the class
    is shared law at the apex.
