rules:
  forbidden:
  - hand-edit or shell-concat new lines into prompt-queue.jsonl
  - use append_entries to delete or rewrite consumed ids
  fixtures: []
  precedence:
  - read current PQ before append (A.5b.0z decide_append per line)
  - honor max_midrun_jsonl_appends_per_eat_queue_run cap
  - optional require-snapshot verify before write when snapshot gate enabled
  - 'policy: bypass dedupe by writing the same repair line with a new id to game the
    queue'
  acceptance:
  - test_a5b_dedupe green
  - test_harness_verify test_append_entries_rejects_inline_grep_paste
