id: harness_append_entries
conceptual:
  outcome: New follow-up work can enter the queue without corrupting it — the vault
    can say 'and also do this' without duplicate noise or manual file surgery.
  summary: Mid-pass discovery needs a legitimate next seat in line — one clean append
    per ask, same contract every time. Registers repair, deepen, wrapper outcomes,
    and hygiene nudges without shouting into the void or duplicating lines.
  primary_case: Mid-run or after a step, the system realizes more work is warranted.
    Instead of shouting into the void or duplicating the same repair three times,
    registration adds one clean new line to the queue — same contract every time.
  edge_cases:
  - The system may refuse to register a near-duplicate — that is protection, not failure.
  - Only so many registrations per pass — prevents runaway self-queueing.
  misread_risks:
  - Using registration to remove finished work — that is release's job.
  - Pasting lines into the queue file yourself — you lose dedupe and the audit story.
  - Expecting every whisper to become a line — some intents are correctly suppressed.
  operator_memory_hook: Something new to do? Register it. Something done? Release
    it.
  polar_pair: harness_rewrite_consumed — release completed asks; append_entries registers
    new ones.
