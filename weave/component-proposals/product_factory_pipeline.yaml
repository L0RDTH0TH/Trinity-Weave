id: product_factory_pipeline
conceptual:
  outcome: Product factory pipeline stages work toward investor/horizon attest and
    continuously updates the current Code-Repos — not blocked behind three operator
    loops or overnight conductor before staging. Factory remains ungreenlit until
    operator investor attest.
  summary: Half B pipeline law. Catalog + release_stage drive generate and
    update_existing_exhibit. UX-before-execution loops deferred theater for pre-greenlit.
    Advanced conductor available after greenlight — not normative until then.
  primary_case: Prefer alpha_0 work (staging capabilities + pdf_to_adventure_packet when
    in scope) into current genesis-mythos-alpha via generate or update under FEEDSTOCK-SHAPE lock.
  secondary_case: After operator greenlit and investor attest, conductor may resume
    loop-aware ticks; lan_listen_server remains alpha_1-only.
  edge_cases:
  - BOM/conduct block refusing any implement/update under staging — soft-gate / warn
  - Claiming pipeline greenlit from card presence alone
  - Treating generate-only as Half B (skipping updates to live exhibit)
  misread_risks:
  - Reading three operator loops as mandatory before front door
  - Equating table-only shrink with Success ceiling
touch:
  primary_paths:
  - 3-Resources/Second-Brain/Docs/Half-B-Alpha-Mode.md
  - .technical/weave/component-proposals/engine_stock_authority.yaml
  - Ingest/PZO9500-9E_WeBeGoblinsFree.pdf
  - 5-Attachments/Code-Repos/genesis-mythos-alpha/
  - scripts/eat_queue_core/weave/user_story/product_factory_pipeline.py
  - scripts/eat_queue_core/weave/user_story/product_factory_ux_context.py
  - scripts/eat_queue_core/weave/factory/factory_bom.py
  behavior_signals:
  - update_existing_exhibit first-class alongside generate
  - Half-B-Alpha-Mode investor Success documented
status: proposal
rules:
  forbidden:
  - claim factory greenlit
  - claim closed_alpha Success
  - revive archived horizon_demo_investor as live Success
  - claim shaped Half-B output without FEEDSTOCK-SHAPE operator lock
  - reintroduce Phase-6-only as global law
  - treat staging table-only as permanent Success ceiling
  - treat Half B as generate-only (no update/extend of current exhibit)
  - require three-operator-loop UX theater before table front door pre-greenlit
  - require overnight multi-loop conductor as normative pre-greenlit path
  - dump Paizo prose into Code-Repos
  precedence:
  - 'policy: release_stage alpha_0 before alpha_1 before beta'
  - 'policy: Half B = generate + update_existing_exhibit'
  - 'policy: 3-Resources/Second-Brain/Docs/Half-B-Alpha-Mode.md — factory_greenlit false'
  - 'policy: FEEDSTOCK-SHAPE.md operator_confirmed required before shaped Half-B claims'
  acceptance:
  - Alpha mode staged; greenlit false
  - update_existing_exhibit documented as first-class
  - FEEDSTOCK-SHAPE lock required; investor ask archived
contract:
  proof:
  - 3-Resources/Second-Brain/Docs/Half-B-Alpha-Mode.md
  - scripts/eat_queue_core/weave/user_story/product_factory_pipeline.py
meta:
