id: product_factory_operator_path
conceptual:
  outcome: Operator can drive Half B generate and update on the current game under
    FEEDSTOCK-SHAPE lock — factory_greenlit true (operator 2026-10-01); claim_class staging until slice attest.
  summary: Half B operator path. Normative pre-greenlit = select catalog slice or
    update/fix on current Code-Repos → implement under stock/seat law → playtest →
    receipt; advance PDF→adventure packet; aim at horizon_demo_investor. Overnight/
    headless/multi-loop is advanced tooling after greenlit, not the default.
  primary_case: Bone pilot updates genesis-mythos-alpha or welds alpha_0 staging rows
    under FEEDSTOCK-SHAPE lock, advances PDF-derived packet when in scope under IP honesty,
    records honest staging receipt — does not claim greenlit.
  secondary_case: After investor attest and operator greenlight, advanced path may use
    PRODUCT_FACTORY_CONTINUE / headless_eat / overnight on a project lane.
  edge_cases:
  - Treating placeholder pack as Success ceiling
  - Requiring three operator loops before any Code-Repos write/update
  - Claiming factory greenlit from this card alone
  misread_risks:
  - Equating staging receipts with investor Success
  - Reading Half B as generate-only
touch:
  primary_paths:
  - 3-Resources/Second-Brain/Docs/Half-B-Alpha-Mode.md
  - Ingest/PZO9500-9E_WeBeGoblinsFree.pdf
  - 5-Attachments/Code-Repos/genesis-mythos-alpha/
  - 5-Attachments/Code-Repos/genesis-mythos-alpha/genesis-mythos/content/packs/
  - scripts/eat_queue_core/weave/user_story/product_factory_pipeline.py
  - scripts/eat_queue_core/weave/user_story/product_factory_continue.py
  - scripts/eat_queue_core/weave/factory/factory_bom.py
  - scripts/eat_queue_core/weave/factory/factory_output_gate.py
  behavior_signals:
  - Half-B-Alpha-Mode normative path generate+update + investor attest
  - bom_blocks soft-gate for slim staging sections
rules:
  forbidden:
  - claim factory greenlit without operator greenlight
  - claim closed_alpha Success from staging playtest alone
  - revive archived horizon_demo_investor as live Success
  - claim shaped Half-B output without FEEDSTOCK-SHAPE operator lock
  - require overnight / headless / multi-loop as normative pre-greenlit path
  - treat Half B as generate-only
  - treat Phase-6-only as global implementation law
  - treat placeholder pack as forever cartridge / Success ceiling
  - dump Paizo prose into Code-Repos
  - overnight or conductor Success around missing stock quote / non-stock FPS / MCP-only feel
  - mark walk+look Done without operator F5 attestation
  precedence:
  - 'policy: lens/maintenance_honesty_anchor — structural > inferred > narrative'
  - 'policy: Half B = generate + update current exhibit'
  - 'policy: 3-Resources/Second-Brain/Docs/Half-B-Alpha-Mode.md is operator home'
  - 'policy: factory_greenlit true (operator greenlight); investor ask archived; no auto-dispatch'
  - 'policy: FEEDSTOCK-SHAPE.md operator_confirmed required before shaped Half-B claims'
  - 'policy: engine_stock_first + godot_stock_fps + operator_kinesthetic_walk_look block'
  acceptance:
  - Half-B-Alpha-Mode states factory_greenlit true (operator); FEEDSTOCK-SHAPE lock required
  - normative path includes update_existing_exhibit
  - PDF→packet path pointed; Godot PRECONDITIONS documented; investor ask archived
contract:
  proof:
  - 3-Resources/Second-Brain/Docs/Half-B-Alpha-Mode.md
  - 3-Resources/Second-Brain/Docs/MCP-Playtest-WalkLook.md
  - weave/component-proposals/product_factory_operator_path.yaml
