rules:
  forbidden:
  - deprecate legacy factory without operator explicit ack
  - treat A/B winner as usage_proven without Phase 14 evidence
  - redesign_factory for additive new responsibility (use expand_self)
  - skip knob parity matrix during A/B unless asymmetry documented in config_knob_parity
  - archive factory without structural honesty receipt (maintenance_honesty_anchor)
  precedence:
  - rust grade before weld — no permanent lock on rusted Run
  - surgical (10g, prune, touch refresh) before rewrite
  - rewrite/refurbish in place before redesign_factory fork
  - 'redesign_factory: both factories provisional until deprecate'
  - force align (scorched earth + meta lens) when rust is systemic across Run layer
  - operator deprecate → archive under 4-Archives/Weave/Factory-Lifecycle/<stamp>/
  - 'after deprecate: consumable pack routes to candidate id only'
  acceptance: []
  fixtures: []
