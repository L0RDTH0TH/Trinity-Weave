  parity_matrix_artifact: .technical/weave/validation/knob-parity-matrix.json
rules:
  forbidden:
  - ship factory behavior change tested under one speed_mode only without matrix update
  - silent asymmetry between knob options
  - redefine speed_mode options as sequential pipeline stages without operator ack
  precedence:
  - explicit queue params > profile expansion > Second-Brain-Config > card Rules defaults
  - 'default familial bundle: speed_mode balance + repair_strategy repair_first + validator_tier forgiving'
  - 'any factory change: evaluate all enumerated options per affected knob'
  - documented asymmetry requires matrix row + operator ack + harness proof reference
  - redesign_factory A/B must include speed_mode matrix unless exempted
  - merge order matches trinity_prompt_context Pull contract
