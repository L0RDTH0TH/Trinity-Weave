conceptual:
  outcome: Every enumerated option under a profile knob stays at development parity
    across factories — fixing balance does not forget fast and quality.
  summary: 'This meta card is **network interlocking for familial profiles**: Config (`Second-Brain-Config`)
    defines knobs; Rules on segments cite them; this meta defines **parity obligations** — when you change
    behavior for one option under a knob, you must evaluate **all sibling options** unless operator documents
    intentional asymmetry. Primary knob family: `speed_mode` (`fast` | `balance` | `quality`) with bundled
    `repair_strategy` and `validator_tier` via config-resolve-profile. Does not duplicate Config bodies
    — **points** at Config and harness proofs.'
  primary_case: 'You fix a redundant gate in the queue factory for `balance` and remove a duplicate check.
    Before lock, you open the **factory × knob matrix**: does `fast` still run the old duplicate path?
    does `quality` still expect the removed check? If yes, that''s **knob skew rust**. You update all
    three paths or file an documented asymmetry row in the matrix with operator ack.'
  secondary_case: 'Scorched earth or redesign_factory A/B: the harness runs `--speed-mode-matrix fast,balance,quality`
    (or config equivalent) and fails if any cell is stale relative to the doctrine row for that factory.'
  edge_cases:
  - Intentional asymmetry — quality runs extra validator; document in matrix, not silent drift.
  - Combo syntax in queue params — config-resolve-profile expansion still counts as explicit lock.
  - Default familial bundle when keys omitted — parity applies to effective resolved profile.
  - Pseudo-clock maintenance ticks — fast path may skip Tier-2 honesty; must be documented per harness_runtime_contract.
  misread_risks:
  - Treating speed_mode options as lifecycle stages — they are parallel options under one knob.
  - Testing only default bundle in CI — parity requires per-option proofs or matrix exemption.
  - Duplicating Second-Brain-Config YAML in this card — digest and precedence only.
  - Applying parity to maintenance_core meta locks — operator mutation only.
  frame_anchor: Profile knob parity — all enumerated options maintained.
  operator_memory_hook: Change one speed_mode option → check the other two.
  refs:
  - '[[3-Resources/Second-Brain-Config.md]]'
  - '[[3-Resources/Second-Brain/Parameters.md]]'
  - '[[.cursor/skills/config-resolve-profile/SKILL.md]]'
  - '[[.technical/weave/components/harness_runtime_contract.yaml]]'
  - '[[.technical/weave/components/factory_lifecycle_doctrine.yaml]]'
touch:
  primary_paths:
  - 3-Resources/Second-Brain-Config.md
