rules:
  forbidden:
  - whole-vault dump in prompt context
  - unrelated trinity_id legs in one bundle
  - green-wash (import-only pass, deleted asserts, skip tests)
  - edit legs outside task write_scope
  - replace dispatcher or Prompt Crafter Q&A bodies in this card
  - maintenance_core YAML write without --operator-mutation
  - Query face invoking Pull write_scope or regen/conduct repair
  - Query dumping whole vault or unbounded closure
  - Query substituting for Research factory external fetch
  - Pull on pure question ingress without Route ingress_class command or mixed split
  fixtures: []
  precedence:
  - Route before Pull on ingress — resolve task_kind then assemble context
  - 'policy: meta card — card_kind meta; fixed id trinity_prompt_context'
  - 'policy: Pull — prefer provisional tier unless task requires locked components'
  - 'policy: Pull conceptual_regen — conceptual block only'
  - 'policy: Pull conduct_repair — contract.proof paths only for writes'
  - 'policy: Route weave_cycle — EAT-QUEUE → Layer 1 Task(queue); no single consumable id'
  - 'policy: Route prompt_crafter — We are making a prompt → full Q&A before append'
  - 'policy: Route architect_packet — goal-authority before inline pipelines'
  - 'policy: Route ambiguous — one clarifying question; never guess trinity_id'
  - 'policy: id resolution — explicit id → resolve_consumable_trinity_id → mode table → path→touch'
  - 'policy: persona gate — Architect vs Curator vs Weave per persona_atlas'
  - 'policy: 10g overlay — proof stderr + nerve fields; does not override Pull write_scope'
  - 'meta prepend: task_meta_faces selects doctrine beyond base meta_prepend_order'
  - 'policy: redesign_factory — load factory_lifecycle_doctrine + config_knob_parity + maintenance_honesty_anchor'
  - 'policy: regen_burn — load factory_lifecycle + honesty + knob parity + agent_implementation_style'
  - 'Route classifies ingress_class: question | command | mixed'
  - question → Query (optional terminal); command → Pull; mixed → Query narrow then Pull action slice
  - Query before Pull when mixed ingress unless operator explicitly action-only
  - 'policy: Query — read-only; claim_tier structural; cite paths/ids; uncertainty when incomplete'
  - 'policy: Query — max_hops and max_ids caps in Rules; truncate with honesty block'
  - 'policy: Query query_kinds — weave introspection only; external research → Research factory Route'
  route_table:
  - trigger: EAT-QUEUE lane <token>
    outcome: layer1_queue; lane filter; task_kind weave_cycle
  - trigger: Resume roadmap / RESUME_ROADMAP
    outcome: resolve_trinity_id_for_mode; task_kind roadmap_continue
  - trigger: trinity_weave_self_wrap --full-corpus
    outcome: harness acceptance_audit; id trinity_spine_maintenance or harness card
  - trigger: trinity_weave_self_wrap --full-corpus --regenerate-complete
    outcome: task_kind regen_burn; scorched-earth gate
  - trigger: We are making a prompt
    outcome: prompt_crafter funnel; no trinity_pack until confirmed append
  - trigger: overnight / goal packet / headless architect
    outcome: architect_packet; packet shield
  - trigger: museum / curator capture
    outcome: curator_capture; lane institute not curator
  - trigger: Fix conduct on <trinity_id>
    outcome: task_kind conduct_repair; Pull then 10g
  - trigger: trinity_redesign_factory
    outcome: task_kind redesign_factory; A/B provisional; operator deprecate gate
  - trigger: trinity_weave_self_wrap --expand-self
    outcome: task_kind expand_self; scoped delta; no scorched earth
  - trigger: what is conduct red / which cards are red / nerve status
    outcome: ingress_class question; query_kind nerve_status; Query face; no Pull
  - trigger: can I pack / consumable check / is * consumable
    outcome: ingress_class question; query_kind consumable_check; Query face
  - trigger: knob parity / speed_mode parity / matrix gap
    outcome: ingress_class question; query_kind knob_parity; Query face
  - trigger: refurb or redesign / factory lifecycle / rust grade
    outcome: ingress_class question; query_kind factory_lifecycle; Query face
