id: trinity_prompt_context
conceptual:
  outcome: Given any trinity_id, operator ingress text, or weave question, hosts use the same honesty-bounded
    contract — Route, optional Query, then Pull — not scattered funnel improvisation.
  summary: 'This **meta** card (`card_kind: meta`) is the **Prompt ↔ Trinity contract** — not maintenance-only
    doctrine, not a duplicate of `trinity_card_authoring` (shape/growth). **Face A (Pull):** given `trinity_id`
    + `task_kind`, which tier to load, which legs enter the prompt, meta prepend order, write scope, forbidden
    patterns. **Face B (Route):** given user/operator prompt, how to traverse Trinity (trigger class,
    persona gate, id resolution order, lane/PQ/harness/layer, `task_kind` for Pull or Query). **Face C
    (Query — optional):** given `query_kind` + scope, **read-only** weave introspection (nerve map, consumable
    check, knob parity matrix, factory lifecycle state, bounded closure) — **no** Pull write scope, **no**
    factory dispatch, **no** external research. Indexes `dispatcher`, `system-funnels`, `trinity_pack`,
    `persona_atlas`, `Queue-Sources` — does not replace them. Host-agnostic packs; Cursor bindings stay
    on `cursor_host_adapter`. Nerve row / proof stderr are **10g task overlays**, not this card.'
  primary_case: 'You say **Fix conduct on harness_l3_validation_drill** or paste a failing proof. Route
    resolves `trinity_id` + `task_kind: conduct_repair` + optional lane. Pull loads provisional/locked
    card, prepends meta cards, includes Touch/Rules/Contract per task table, forbids green-wash. **10g**
    may add stderr overlay; Pull rules still govern write scope (`contract.proof` only). You say **EAT-QUEUE
    lane godot** — Route says weave cycle, Layer 1 queue, no single consumable id; Pull is not invoked
    for pack on one card. You say **We are making a prompt** — Route sends Prompt Crafter funnel; no `trinity_pack`
    until queue line confirmed. You ask **Which harness cards are conduct-red?** — Route sets `ingress_class:
    question` and `query_kind: nerve_status`; **Query** reads corps-nerve-map (bounded), returns structural
    tier answer with ids and paths — **Pull is not invoked**. You ask **Can I pack this provisional on
    maintenance PQ?** — Route → `query_kind: consumable_check` → Query only. Mixed ingress (**what is
    red on godot lane and fix conduct on harness_x**) → Query narrow scope first, then Route/Pull for
    the action half.'
  edge_cases:
  - Explicit trinity_id in message — Route uses it before mode table.
  - Non-consumable provisional on maintenance PQ — Route hard stop per trinity_pack.
  - Architect packet mode — Route blocks inline pipeline until goal-authority confirmed.
  - MCP-less Task subagent — Pull still applies; safety best-effort per agent_implementation_style.
  - Multiple ids in one message — Route picks primary or asks one clarifying question.
  - Meta card self-reference — Pull includes this card in prepend order after style + authoring.
  - Query-only ingress — no Pull, no write_scope, no queue append.
  - Mixed question + command — Query first on question slice; Pull only for resolved action trinity_id.
  - Query cap exceeded — truncate with honesty uncertainty; never dump whole vault.
  - Query on external/web research intent — Route to Research factory; Query stays weave introspection
    only.
  misread_risks:
  - Treating this as A-meta maintenance repair only — it is **meta** for **all** hosts and ids.
  - Baking nerve red into doctrine — nerve data is 10g overlay.
  - Replacing dispatcher/system-funnels bodies — index + digest only.
  - Pull includes whole vault — forbidden; caps in Rules.
  - Route guesses id on ambiguous chat — must clarify or needs_confirm.
  - Duplicating Prompt Crafter Q&A — Route indexes crafter; does not embed §1 questions.
  - Cursor Task assumptions on this card — use cursor_host_adapter.
  - Using Pull audit_readonly as substitute for Query — Query is smaller, no action legs.
  - Query performing regen, conduct repair, or PQ writes — forbidden.
  - Treating Query as long-form vault synthesis — bounded structural answers only.
  - Skipping Query on ambiguous status questions and loading full meta prepend via Pull.
  frame_anchor: Ingress **Route**; optional read-only **Query**; action **Pull**.
  operator_memory_hook: Route → (Query?) → Pull; Query never writes.
  refs:
  - '[[3-Resources/Second-Brain/Docs/Maintenance-Trinity-Constitution]]'
  - '[[3-Resources/Second-Brain/Queue-Sources]]'
  - '[[3-Resources/Second-Brain/Docs/Component-Trinity]]'
  - '[[.cursor/rules/always/dispatcher]]'
  - '[[.cursor/rules/always/system-funnels]]'
  - '[[.cursor/rules/always/architect-goal-packet-shield]]'
  - '[[.cursor/rules/context/curator-agent]]'
  - '[[.technical/weave/components/trinity_card_authoring.yaml]]'
  - '[[.technical/weave/components/conceptual_style_guide.yaml]]'
  - '[[.technical/weave/components/persona_atlas.yaml]]'
  - '[[.technical/weave/components/harness_runtime_contract.yaml]]'
  - '[[.technical/weave/component-proposals/meta-review-20260605/factory_lifecycle_doctrine.yaml]]'
  - '[[.technical/weave/component-proposals/meta-review-20260605/config_knob_parity.yaml]]'
  - '[[.technical/weave/component-proposals/meta-review-20260605/maintenance_honesty_anchor.yaml]]'
