conceptual:
  outcome: Maintenance and factory outputs stay honest — structural proof before success claims; uncertainty
    explicit when proof is absent.
  summary: 'This meta card is the **honesty anchor** for maintenance core and Run receipts: anti-hallucination
    as **claim classification**, not a second verification religion. Tier 0 (always): conduct, align,
    verifier, confidence bands. Tier 1: uncertainty block on yellow/mid-band. Tier 2: validator, IRA,
    10g, optional k-sample on strict/quality or standalone harness host. **Precedence:** structural >
    inferred > narrative. Narrative cannot upgrade tier without re-proof. Host-agnostic — Cursor today,
    standalone harness tomorrow (see harness_runtime_contract honesty budget).'
  primary_case: 'A self-wrap run reports pass_gate green. The honesty anchor requires the receipt to say
    **structural** (conduct ok, report path, counts) — not prose alone. If only narrative summary exists,
    emit **inferred** with uncertainty: what would falsify the claim, which proof is missing. Watcher/intent
    receipts use provisional_success + divergence_codes when enforcement incomplete — already aligned
    with this card.'
  secondary_case: 'redesign_factory A/B: neither factory wins on narrative; compare structural telemetry,
    conduct, knob parity cells, honesty tier per host.'
  edge_cases:
  - balance mode — Tier 0 + Tier 1 only; no k-sample tax unless configured.
  - Standalone harness host — Tier 2 may use self-consistency and token entropy when API exposes them.
  - MCP-less Task — structural proof from files and pytest; no fake logprob claims.
  - 'Merge into agent_implementation_style — operator may fold this card into #1 if preferred; keep one
    honesty source.'
  misread_risks:
  - Duplicate gates stacked on gates — honesty tiers add classification, not redundant checks at same
    stage.
  - Chat confidence theater without structural receipt.
  - Import-only smoke as structural green.
  - Skipping uncertainty block when post_loop_conf flat or decayed.
  frame_anchor: Honesty anchor — claim tiers, uncertainty, host-capability budgets.
  operator_memory_hook: Structural before success; say what you don't know.
