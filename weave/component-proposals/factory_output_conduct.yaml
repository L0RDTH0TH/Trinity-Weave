id: factory_output_conduct
conceptual:
  outcome: Product slice Success claims require conduct on LaunchShell → PlayRegion (alpha track) —
    smokes, Sparky weld, and no narrative deferral loopholes — not stack-only or orphan-harness proof.
  summary: Factory output honesty card for Product 2 (closed_alpha). Binds slice smokes,
    LaunchShell → PlayRegion critical path, Core/ narrative drift scan, and enforcement ladder off|warn|block.
  primary_case: Agent marks slice3 complete after stack interpretation_pass while Main.tscn
    still uses legacy DMCameraRig — conduct proofs fail before Success.
  secondary_case: Operator runs factory-output-gate in warn mode — trace receives warnings
    without blocking ship rollup grandfathered slices.
  edge_cases:
  - Grandfathered slices 1–4 complete_pre_conduct until re-proof under block mode
  - Ortho tabletop stack-green but not operator-bound — documented gap not silent waiver
  - little_val_ok on harness scene without Main.tscn weld
  misread_risks:
  - Treating stack_baseline_honesty green as closed_alpha slice conduct
  - Re-opening until-then little_val-only slice Trinity deferral
