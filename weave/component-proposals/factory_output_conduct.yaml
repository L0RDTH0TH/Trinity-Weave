id: factory_output_conduct
conceptual:
  outcome: Product slice Success claims eventually require conduct on the real table path —
    but Alpha 0 implementation must start under warn or off. Block mode only when the
    operator explicitly promotes a ship claim (closed_alpha / release promote).
  summary: Factory output honesty card. Staged enforcement ladder off|warn|block. For
    implementation_release_stage=alpha_0, default warn (or off); do not require block to
    begin table + example module work. Closed_alpha ship claims still bind LaunchShell →
    PlayRegion smokes, Sparky weld honesty, and no narrative deferral loopholes.
  primary_case: Alpha 0 agent implements table_front_door under warn/off — conduct proofs
    may warn; they do not hard-stop starting Code-Repos work.
  secondary_case: Operator sets factory_output_trinity_gate=block for a ship claim —
    conduct proofs must pass before Success rollup.
  edge_cases:
  - Grandfathered slices complete_pre_conduct until re-proof under block mode
  - Ortho tabletop stack-green but not operator-bound — documented gap not silent waiver
  - little_val_ok on harness scene without Main.tscn weld
  misread_risks:
  - Treating stack_baseline_honesty green as closed_alpha slice conduct
  - Treating Alpha 0 warn-mode playtest as closed_alpha Success
  - Re-opening until-then little_val-only slice Trinity deferral under block mode
touch:
  primary_paths:
  - Docs/Half-B-Alpha-Mode.md
  - 1-Projects/godot-genesis-mythos-master/Factory-DRB/Release-Definitions/closed-alpha-v1.md
  - 5-Attachments/Code-Repos/genesis-mythos-alpha/PlayRegion.tscn
  - 5-Attachments/Code-Repos/genesis-mythos-alpha/LaunchShell.tscn
  - 5-Attachments/Code-Repos/genesis-mythos-alpha/LaunchShell.cs
  - 5-Attachments/Code-Repos/genesis-mythos-alpha/PlayRegion.cs
  - 5-Attachments/Code-Repos/genesis-mythos-alpha/Camera/SparkyDmFreeCamRig.cs
  - 5-Attachments/Code-Repos/genesis-mythos-alpha/Core/
  - .technical/parallel/godot/goal-authority.json
  - .technical/weave/host-weld/pilots/implementation_factory_loop.md
  - 5-Attachments/Code-Repos/genesis-mythos-alpha/project.godot
  - 1-Projects/godot-genesis-mythos-master/Factory-DRB/Release-Definitions/Ship-Rollup-v1.md
  - scripts/eat_queue_core/weave/factory/factory_output_gate.py
  harness_commands:
  - factory_output_conduct
  - factory_output_gate
  - trinity_align
  behavior_signals:
  - alpha_0 resolves to warn or off unless operator sets block for ship claim
  - test_product_play_path_launch_to_play_region
  - test_factory_output_conduct_card_present
  meta_lens_force_align: true
rules:
  forbidden:
  - require factory_output_conduct block mode to start alpha_0 implementation
  - claim closed_alpha slice complete without Main.tscn smoke pass when enforcement_mode is block
  - use orphan harness scene as Alpha stand-in for closed_alpha slice Success
  - waive Sparky visual weld by default when stack interpretation_pass is green under block
  - defer slice Trinity to little_val_ok only (until-then loophole) under block
  - claim factory greenlit
  - claim closed_alpha Success from alpha_0 warn-mode alone
  precedence:
  - 'policy: lens/host_execution_safety_contract — protected_paths_and_trash_policy_are_non_negotiable'
  - 'policy: lens/maintenance_honesty_anchor — structural > inferred > narrative'
  - 'policy: alpha_0 → warn|off; block only on operator ship promote'
  - 'policy: stack_baseline_honesty gates Product 1 — factory_output_conduct gates Product 2 under block'
  - 'policy: enforcement_mode warn must not block grandfathered complete_pre_conduct slices'
  acceptance:
  - Docs/Half-B-Alpha-Mode.md states block not required to start alpha_0
  - resolve helper prefers warn for alpha_0 when gate unset
contract:
  proof:
  - scripts/eat_queue_core/weave/factory/factory_output_gate.py
  - Docs/Half-B-Alpha-Mode.md
  invariant_ids:
  - factory_output_main_conduct
  - closed_alpha_no_until_then_loophole
  - alpha_0_conduct_not_block_by_default
