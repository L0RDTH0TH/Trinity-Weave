id: council_seat_agents
conceptual:
  outcome: You get a dependable outcome from feature council seat agents — parallel
    `agent -p` invocations — without guessing from logs alone.
  summary: 'Council Seat Agents exists so everyday operation stays understandable:
    what it protects, when it runs, and what ''done'' feels like for someone who does
    not read the implementation. Feature Council seat agents — parallel `agent -p`
    invocations.'
  primary_case: You are about to rely on council seat agents. You should know within
    a minute why it matters, what good looks like, and what would be a dangerous misunderstanding
    — in plain language.
  edge_cases:
  - Session or plan id pasted into narrative — must stand alone for batch generation.
  - Outcome reads like a module docstring — busy operators skim past it.
  - Treating council seat agents as optional when the maintenance board says it is
    due.
  misread_risks:
  - Writing about the documentation system instead of what the person gains.
  - Copying implementation vocabulary into the outcome line.
  - Locking narrative before a human read-through — story drifts from reality.
