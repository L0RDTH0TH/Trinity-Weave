id: harness_rewrite_consumed
conceptual:
  outcome: The vault stops asking you to do work you already finished — the queue
    reflects what is still open, not a graveyard of completed asks.
  summary: 'Every queue pass is a conversation: the system proposed jobs, ran them,
    and some completed. Release is the moment you close those chapters. Without release,
    the same asks keep resurfacing — duplicate effort, false urgency, and the feeling
    that nothing ever clears. This is the opposite pole from registration: registration
    adds new asks; release clears honored ones.'
  primary_case: You ran work (in chat or in the background). Items that truly finished
    should no longer sit in your 'still to do' list. Release removes them so the next
    pass only sees what remains.
  edge_cases:
  - Something failed or needs another look — it stays until you decide otherwise.
  - Two parallel tracks may both need to forget the same finished ask — release must
    be complete, not half.
  misread_risks:
  - Treating release as housekeeping instead of honesty — the queue lies if finished
    work stays listed.
  - Releasing before follow-up work is registered — you can erase an ask that still
    needed a sequel.
  - Hand-editing the list — breaks trust in what the system thinks is still open.
  operator_memory_hook: Done means off the list. Release = cross off finished asks.
  polar_pair: harness_append_entries — register new asks; this card releases completed
    ones.
