rules:
  forbidden:
  - ad-hoc PQ line deletion outside harness rewrite_consumed or full_cycle helpers
  fixtures: []
  precedence:
  - Layer 1 mandatory pre-write PQ re-read before invoking harness
  - prefer --plan EQPLAN queue_rewrite_ids over ad-hoc --ids when both exist
  - dual-track fanout → apply_queue_cleanup_dual_track unless --single-pool
  - 'policy: rewrite before processed_success_ids and Pass 3 ids are merged into the
    plan'
  - 'policy: dual-track partial removal (track only or pool only) when fanout is enabled'
  acceptance:
  - test_pool_sync test_apply_queue_cleanup_dual_track green
  - queue.mdc A.7 harness rewrite_consumed only
