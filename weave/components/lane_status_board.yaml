id: lane_status_board
conceptual:
  outcome: The Weave Status Board gives the operator a trustworthy remote view of
    factory readiness and run state — without the console.
  summary: Obsidian-facing factory-first surface (warehouses → factories → lane strip)
    over the lane snapshot kernel — no inferring live Run from receipt history.
  primary_case: Operator opens Ingest/Weave-Status-Board.md. Board shows warehouse/factory
    readiness and Run after mandatory reconcile — refreshed timestamp visible. Operator
    reads system_attention and acts from that glance alone.
  edge_cases:
  - 'Two axes are orthogonal: healthy lane can be paused; unhealthy lane can be running
    — never collapse into one signal.'
  - Ops/Syncthing partition may lag Bulk `.technical/` — a fundamental limitation.
    Mistrust came from wrong semantics on the board (what was sent), not from sync
    latency alone; refreshed stamp + kernel-only fields mark what the operator can
    trust on this device.
  - Recent runs is historical audit only; never drives the Run column.
  - Paused policy overrides Run regardless of registry or receipt noise.
  - Empty queue shows — for est. drain; absence of work is not hidden failure.
  - system_attention rollup must reflect worst meaningful lane signal, not cosmetic
    green.
  misread_risks:
  - Receipt tail or last ok:false treated as live Run or primary failure story.
  - Health and Run collapsed into one inferred running or healthy state.
  - Historical Recent runs collapsed with liveness into one signal.
  - PQ depth alone interpreted as unhealthy or running.
  - Stale or semantically wrong board (TL;DR, frontmatter, or table disagree, or Run
    inferred from receipts) — operator cannot trust the surface.
  - Manual edits to machine-maintained sections that drift from harness output.
  - Assuming sync speed caused mistrust when the payload semantics were wrong.
  operator_trust: The operator must always be able to trust what they see on the Weave
    Status Board.
  refs:
  - '[[1-Projects/second-brain-curator-master/second-brain-curator-master-goal]]'
  - '[[3-Resources/Second-Brain/Docs/Operator-Surface-Maintenance-Spec]]'
  - '[[3-Resources/Second-Brain/Docs/Lane-Status-Board-Rules]]'
  - '[[3-Resources/Second-Brain/Docs/Syncthing-Sync-Partitions]]'
  - '[[Ingest/Weave-Status-Board]]'
