rules:
  forbidden:
  - receipt or history implies Run
  - health and Run collapsed; depth alone implies either
  - second classifier for Run or health
  - TL;DR FM table disagree or integrity_ok false shipped
  - mtime or manual edits over harness snapshot
  fixtures:
  - ghost_inflight
  - receipt_success_only
  - paused_policy
  - kernel_stable_double_read
  precedence:
  - 'pre_read: reconcile_launch_registry + release_stale_orchestration_lock'
  - 'kernel: build_lane_snapshots — Run + health_score authoritative'
  - 'Run: resolve_lane_activity only'
  - 'Health: compute_lane_health / snapshot only'
  - 'view: board maps snapshot — zero inference'
  - 'write: TL;DR + FM + Lanes table aligned same pass'
  - 'freshness: refreshed frontmatter every write'
  - 'fail: integrity fail → OPERATOR_SURFACE_REPAIR stub — no silent ok'
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  acceptance:
  - test_board_fixtures green
  - validate_lane_board_integrity ok
  - verify_operator_surface_integrity ok
  - FM lane_run_* matches Lanes Run badge per lane
  - trinity_align ok when trinity_checks_enabled
  - conceptual_confirmed_at set before production flip
  maintainer_invocation: 'MAINTAIN OPERATOR SURFACE

    trinity_id: lane_status_board

    concept: lane_run_status

    serve: operator_trust + Health/Run axes

    blast_radius: .technical/weave/blast-radius/lane-run-status.yaml

    forbidden: receipt→run, collapse axes, stale sections

    fixtures: ghost_inflight, receipt_success_only

    gate: validate_lane_board_integrity + trinity_align

    '
