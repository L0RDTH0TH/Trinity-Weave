rules:
  forbidden:
  - treat allowlist as recoverability definition
  - reconcile on low confidence or unbounded blast
  - improvise handler off catalog
  - skip predictive or symbolic gates
  - open-ended backbone or rules mutation overnight
  - confuse stall with any error without circling semantics
  - handler success without forward-momentum check
  fixtures:
  - pq_locked_recoverable
  - unknown_code_fail_closed
  - live_holder_skip_release
  precedence:
  - classify stall and primary_code before any handler
  - recoverability class criteria before member selection
  - gate chain before handler impl
  - fail closed to ticket when class test fails
  - irrecoverable routes to L5 agent swarm (l5_sandbox) when armed; else human gate
  - L3 when-to-auto-heal defers to l3_self_heal card
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  acceptance:
  - recoverable class tests green
  - unknown codes non_recoverable
  - gated run_recoverable_handler returns structured ok or error
  maintainer_invocation: 'MAINTAIN OPERATOR SURFACE

    trinity_id: recoverable_handlers

    concept: recoverable_repair

    serve: bounded reconciliation — high confidence, forward movement, won''t break
    work

    forbidden: off-catalog improvise, skip gates, open-ended backbone edit

    gate: classify recoverable → member handler → predictive + symbolic

    '
