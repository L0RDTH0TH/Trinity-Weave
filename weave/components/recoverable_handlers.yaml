id: recoverable_handlers
conceptual:
  outcome: Recoverable problems are a bounded class — diagnosed with confidence, obvious
    reconciliation, forward-assisting, blast-bounded — before orchestration spends
    cycles on them.
  summary: Defines the recoverability class, not today's handler list. A stall is
    spin without closing the locus. Recoverable means safe to automate closure with
    a known recipe; allowlisted handlers in code are current members and evolve with
    doctrine.
  primary_case: Something fails mid-run but feels familiar. You expect classification,
    gates, then one mapped reconciliation that assists momentum — or an early not-recoverable
    signal instead of heroic guessing.
  edge_cases:
  - Unknown primary_code → non_recoverable (fail closed) — not a member gap to improvise.
  - human_gate and require_confirm → ticket without auto-reconciliation.
  - release_pq_lock skips when holder alive — not failed repair; avoids breaking live
    work.
  - operator_surface_repair Phase 1 member = board refresh; class allows richer members
    when proven.
  - Trinity disconnect queues OPERATOR_SURFACE_REPAIR; member may refresh board while
    class tracks root cause.
  - reconcile_launch_registry as handler is repair member, not bypass of mandatory
    pre-read on reads.
  - predictive critical tier may block high-blast members; class still recoverable
    when tier permits.
  - stall_class non_recoverable or irrecoverable → route to L5 agent swarm (trinity_id
    l5_sandbox; off by default — ticket + human gate until armed). L5 sandbox loop
    is the test slice only, not the full agent swarm system.
  misread_risks:
  - Treat allowlist as the definition of recoverability instead of the class criteria.
  - Improvise handlers off-catalog on low confidence.
  - Confuse stall with any error — circling without advance vs one-shot failure.
  - operator_surface_repair name implies full weave/code repair — member is refresh-only
    today.
  - Skip symbolic or predictive gates because handler looks harmless.
  - Assume handler ok means lane healed — verifier and retry are separate.
  operator_trust: 'Operator trusts that recoverable means the system knew what it
    hit and chose a reconciliation that moves forward without wrecking the run. When
    the class test fails, fail closed — ticket and human gate; irrecoverable operations
    route to L5 agent swarm when armed (trinity_id l5_sandbox; off by default). L5
    sandbox loop is the test slice only, not the full agent swarm system.

    '
  refs:
  - '[[3-Resources/Second-Brain/Docs/Lane-Recovery-and-Recoverable-Codes]]'
  - '[[3-Resources/Second-Brain/Docs/Weave-L3-Self-Healing]]'
  - '[[3-Resources/Second-Brain/Docs/Component-Trinity]]'
  - '[[.technical/weave/components/l3_self_heal.yaml]]'
  - '[[.technical/weave/components/l5_sandbox.yaml]]'
  - '[[.technical/weave/components/launch_registry_reconcile.yaml]]'
  - '[[.technical/weave/components/lane_status_board.yaml]]'
  operator_memory_hook: Known fault class → one mapped reconciliation.
