id: l4_adaptive_policy
conceptual:
  outcome: Unknown failures become learnable over time — repeated signals can graduate
    into maintained operations instead of endless one-off guesses.
  summary: 'L4 owns the unmapped case: record stoppages and inefficiencies, correlate
    across pseudo-clock audits, propose durable adoptions for operator approval. Does
    not execute recovery; proposes permanent mappings when evidence accumulates.'
  primary_case: The same unfamiliar stoppage keeps appearing. Self-heal correctly
    does nothing unmapped. You want pattern evidence and eventually a maintained fix
    to approve — not silent improvisation each night.
  edge_cases:
  - Registry match on arrival — adaptive idle; L3 only.
  - First occurrence — register and observe; no adoption proposal yet.
  - Recurrence across audits — proposal with explicit add-vs-modify recommendation.
  - Short-term scary option with long-run benefit — proposal must state both costs.
  misread_risks:
  - Using adaptive to funnel every error into immediate self-heal retries.
  - Replacing global behavior when a new maintained path suffices.
  - Skipping pseudo-clock audit and proposing adoptions from a single bad run.
  - Confusing adaptive with profile tuning, little val, or operator-surface honesty.
  operator_memory_hook: Not in the book? Don't guess — adapt on the clock, then add
    another way we operate.
  spine_ordinal: 7
  set: governance_pyramid
  polar_pair: l3_self_heal — fix what we already maintain; l4_adaptive_policy — adapt
    what we do not yet maintain.
