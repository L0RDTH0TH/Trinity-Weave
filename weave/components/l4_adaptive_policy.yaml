touch:
  primary_paths:
  - scripts/eat_queue_core/weave/adaptive_policy.py
  - scripts/eat_queue_core/pseudo_clock.py
  inbound:
  - run outcomes, stalls, and blocks that fail registry / recoverability lookup
  - inefficiency and stoppage signals (gaps, metrics, hard blocks, recurrence)
  - pseudo_clock tick — timed background audit trigger
  - touch peer ghost_skill_audit — converse payload (pending proposals, registry slice,
    pattern fingerprint) before this side proposes
  outbound:
  - inefficiency and stoppage registry (durable pattern store)
  - permanent-adoption proposals (add or modify maintained support)
  - maintenance or governance queue lines for operator/counselor review
  - board summary of pending adoptions and audit rationale
  - touch peer ghost_skill_audit — converse request (shared telemetry/metrics.jsonl
    slice, recurrence keys, gap keys) before this side proposes
  behavior_signals: []
rules:
  forbidden: []
  fixtures: []
  precedence:
  - 'converse_before_propose: read ghost_skill_audit touch outbound; no permanent-adoption
    proposal if peer has pending ghost/skill path for same pattern fingerprint'
  - registry lookup and L3 dumb path first — known fix only
  - adaptive engages only for non-normal (unmaintained) failures
  - pseudo-clock audit batches evidence before permanent-adoption proposals
  - approved adoptions graduate into registry so L3 can act dumbly next time
  - 'policy: let L3 run allowlisted handlers when the failure class is not registry-maintained'
  - 'policy: propose permanent adoption from a single observation without audit recurrence'
  - 'policy: replace how the system operates when an added maintained path is sufficient'
  - 'policy: auto-install adoptions that change invariants or blast radius without
    approval'
  - 'policy: propose permanent adoption without converse read of ghost_skill_audit
    touch peer (same pattern fingerprint)'
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  acceptance:
  - unmaintained failures never trigger silent L3 improvisation
  - audit cadence can accumulate recurrence before proposing adoption
  - every proposal states add vs modify and long-run vs short-run tradeoff
  - post-approval, the same failure class is routable as a normal maintained operation
  - converse gate documented on paired proposal payloads
