id: trinity_spine_maintenance
conceptual:
  outcome: When the weave's design shifts, maintenance can keep the operator's trusted
    reference library aligned with what the system actually runs — without hand-checking
    every provisional draft line by line.
  summary: 'Spine maintenance is the joint between your locked gauges and vehicle
    sections and the wider corpus of drafts waiting behind them. Gauges tell you what
    is happening now; spine maintenance asks whether the reference library still matches
    reality. When philosophy changes or provisionals pile up, it runs boundary checks,
    align sweeps, and bounded escalations — never silently rewriting what you already
    locked. It is not the board, not the handler catalog, not governance memory itself;
    it coordinates corpus health across those integral sections. **Dual-lock (Phase
    8):** This card is bridge **B** between frozen core **A** (maintenance components)
    and corps **C** (provisionals). New harness wiring lives on provisional bridge
    **D** with `tunnel_via: trinity_spine_maintenance` — never direct `tunnel_via`
    on core **A**. `TRINITY_SPINE_CATCHUP` sweeps mutable non-core only; core is read-only
    for automation.'
  primary_case: You approve a new maintenance pattern or a gauge section's story shifts
    after a deepen pass. Locked references stay authoritative. A spine pass compares
    provisionals and peers, refreshes what is safe, and surfaces only disconnects
    that need your decision.
  edge_cases:
  - Locked reference disagrees with a provisional — escalate; do not auto-promote
    or auto-lock.
  - Disconnect found on a gauge card — repair that component's reference, not this
    joint.
  - Boundary audit fails on a maintenance component — stop corpus catch-up until components
    are green.
  - Operator has not requested regen — no in-place Conceptual rewrite on locked or
    provisional files.
  - Bridge run resolves wrong pack — component work uses component ids; corpus work
    uses this id.
  misread_risks:
  - Treating spine maintenance as the Lane Status Board gauge (that is lane_status_board).
  - Merging handler catalog and L3 orchestration because both appear in a sweep report.
  - Batch-regenerating or batch-locking to make a sweep look green.
  - Assuming align quiet means Conceptual voice is validated — boundary and operator
    lock are separate gates.
  operator_memory_hook: Gauges read truth; spine maintenance keeps the reference library
    honest with the weave.
  refs:
  - '[[3-Resources/Second-Brain/Docs/Maintenance-Dual-Mandate]]'
  - '[[3-Resources/Second-Brain/Docs/Maintenance-Trinity-Lock-Checklist]]'
  - '[[3-Resources/Second-Brain/Docs/Component-Trinity]]'
