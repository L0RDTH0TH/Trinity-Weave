rules:
  forbidden:
  - trinity_spine_cascade --write-in-place without explicit operator request
  - System must not auto-mutate this maintenance-core card (operator --operator-mutation
    only).
  fixtures: []
  precedence:
  - load trinity-partition-registry (role gauge vs vehicle)
  - run trinity_boundary_audit on maintenance components before corpus catch-up
  - align components first; then provisionals with --include-provisional
  - escalate unresolved disconnects; never silent rewrite of locked Conceptual legs
  - trinity_lock_card only per-id with operator intent
  - 'policy: batch trinity_lock_card on provisionals'
  - 'policy: auto-promote provisionals to locked components'
  - 'policy: copy component primary_paths into this bridge as ownership'
  - 'policy: report corpus-green while maintenance component boundary audit has errors'
  - 'policy: merge two component references into one because a sweep lists both'
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  - Catch-up MUST NOT write maintenance-core component YAML; hash-only gate reconcile
    on core allowed.
  maintainer_invocation: 'MAINTAIN TRINITY SPINE

    trinity_id: trinity_spine_maintenance

    concept: trinity_spine_maintenance

    scope: maintenance partition components then provisionals

    forbidden: batch lock, cascade write-in-place, owning component code paths

    '
  acceptance:
  - trinity_boundary_audit ok on maintenance component set
  - bridge lists >=2 component ids in touch.bridges
  - no primary_path overlap with locked component anchors (boundary audit)
