rules:
  forbidden:
  - auto-lock upgraded component without operator Conceptual approval
  - System must not auto-mutate this maintenance-core card (operator --operator-mutation
    only).
  fixtures: []
  precedence:
  - operator supplies upgrade Conceptual (outcome at minimum) before lock on new component
  - run trinity_boundary_audit on target id + overlap_watch peers
  - resolve trinity_pack to upgrade target component id for component work
  - resolve trinity_pack to trinity_upgrade_integration for integration-only PQ
  - escalate anchor collision or primary_path_overlap; never silent merge
  - 'policy: trinity_spine_cascade --write-in-place on locked cards during upgrade
    pass'
  - 'policy: merge upgraded section into neighbor card Conceptual'
  - 'policy: assign bridge primary_paths from component anchors'
  - 'policy: skip boundary audit on upgrade target and overlap_watch peers'
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  - Upgrade integration MUST tunnel via this bridge (B) — no direct corps mutation
    of core component cards.
  maintainer_invocation: 'INTEGRATE TRINITY UPGRADE

    trinity_id: trinity_upgrade_integration

    upgrade_target: <component_trinity_id>

    operator_conceptual: required

    peers: overlap_watch from registry

    forbidden: corpus sweep, batch lock, owning component paths

    '
  acceptance:
  - boundary audit on target + peers
  - upgrade target has single registry primary_anchor when component
