id: trinity_upgrade_integration
conceptual:
  outcome: Upgrades must prove the spine can carry new weight — with compensating
    changes planned before implementation, not discovered only after merge.
  summary: 'Design-time joint on the maintenance spine: name load, peers, and compensators
    before ship; adapt after mistakes without abandoning intent. Distinct from corpus
    sweep (spine maintenance); does not rewrite locked gauge doctrine. **Dual-lock
    (Phase 8):** Upgrade compensators and predesign load live on provisional bridge
    **D** with `tunnel_via: trinity_upgrade_integration` (this bridge **B**), not
    by editing core **A** Touch legs. Operator owns Conceptual on core targets; corps
    curates D Touch/Rules only.'
  primary_case: You are designing a new capability or behavior change. Before implementation
    you state intent, target section, and compensators; boundary checks on peers turn
    gaps into a plan — not merge surprise. If you forgot a trigger post-ship, you
    re-open integration under the same bridge without batch-rewriting neighbors.
  primary_case_alt: 'Implementation already landed or you are mid-flight and realize
    a forgotten trigger:

    "this change should have fired that handler / updated that gauge / moved that
    anchor."

    Re-open integration under this bridge — add the compensating plan, re-audit peers,

    adjust Touch or queue hand-offs — without violating the original upgrade intent
    and

    without batch-rewriting locked neighbors.

    '
  edge_cases:
  - Predesign only (no code yet) — boundary audit on declared target + peers; document
    compensators.
  - Post-merge "oops" — same bridge; escalate anchor collision; do not auto-merge
    cards.
  - Upgrade touches multiple inventory rows — operator splits scope or sequences compensators.
  - Compensator would duplicate a neighbor's outcome — rewrite plan, not neighbor
    lock.
  - Operator intent unclear — stop; Conceptual on target component must be stated
    first.
  misread_risks:
  - Shipping code first and using this bridge only as post-hoc lint (predesign skipped).
  - Using trinity_spine_maintenance for a forgotten compensator (corpus drift ≠ upgrade
    fit).
  - Letting automation rewrite locked Conceptual to "fix" integration (intent violation).
  - Treating a green boundary audit as substitute for planned compensating changes.
  - Merging upgrade scope into spine maintenance and blurring two joints.
  operator_memory_hook: Predesign the weight on the spine; "oops" still triggers this
    bridge, not the sweep.
  refs:
  - '[[3-Resources/Second-Brain/Docs/Maintenance-Dual-Mandate]]'
  - '[[3-Resources/Second-Brain/Docs/Maintenance-Trinity-Lock-Checklist]]'
  - '[[3-Resources/Second-Brain/Docs/Weave-Component-Inventory]]'
