id: launch_registry_reconcile
conceptual:
  outcome: reconcile_launch_registry is the mandatory pre-read before Run classification
    and board refresh. It closes completed fanout parents and ghost-clears stale in_flight
    rows so lane_activity and the remote board see forward momentum — not registry
    debris.
  summary: Mandatory pre-read before Run classification and board refresh. Closes
    completed fanout parents and ghost-clears stale in_flight rows so activity resolution
    and the remote board show forward momentum — not registry debris. Does not compute
    Run or Health.
  primary_case: Before every board write, reconcile runs first. Completed children
    close their parent; dead or aged in_flight rows clear. You open the board and
    trust that running means something live — not leftover registry noise.
  edge_cases:
  - max_age_minutes abandons stale rows — registry hygiene, not lane failure.
  - L3 reconcile_launch_registry handler is allowlisted repair — not a bypass of pre-read
    order.
  - Parent in_flight while any child still active — parent stays until children terminal.
  - Live PID on row — skip ghost clear for that row.
  - Second pass may close parents after child ghosts cleared.
  misread_risks:
  - Skip reconcile because receipts look idle.
  - Treat reconcile failure or error as proof lane is running.
  - Ghost in_flight row read by lane_activity without prior reconcile → false running.
  - Stale registry row treated as forward momentum on operator board.
  operator_trust: Ghost registry rows broke operator trust on Run before reconcile
    existed. This step ensures lane_activity reads current launch truth, not historical
    in_flight debris. Touch and Rules enforce pre-read order; they do not replace
    lane_activity or the board.
  refs:
  - '[[3-Resources/Second-Brain/Docs/Operator-Surface-Maintenance-Spec]]'
  - '[[3-Resources/Second-Brain/Docs/Weave-L3-Self-Healing]]'
  - '[[.technical/weave/components/lane_status_board.yaml]]'
  - '[[.technical/weave/components/lane_activity.yaml]]'
  operator_memory_hook: Reconcile first; then Run means something.
touch:
  blast_radius: .technical/weave/blast-radius/lane-run-status.yaml
  primary_paths:
  - scripts/eat_queue_core/launch_registry_reconcile.py
  inbound:
  - scripts/eat_queue_core/orchestrator_io.py
  - .technical/orchestrator-launch-registry.jsonl
  outbound:
  - scripts/eat_queue_core/lane_activity.py
  - scripts/eat_queue_core/lane_snapshot.py
  - scripts/eat_queue_core/lane_status_board.py
  - scripts/eat_queue_core/headless_fanout.py
  - scripts/eat_queue_core/recoverable_handlers.py
  pre_read_callers:
  - write_lane_status_board
  - registry_rows_active_for_lane(reconcile_first=True)
  - auto_clear_stale_lane_locks
  queue_modes:
  - REFRESH_LANE_BOARD
  - OPERATOR_SURFACE_REPAIR
  - MAINTAIN OPERATOR SURFACE
  behavior_signals:
  - test_parent_closed_when_all_children_completed
  - test_maintenance_idle_after_reconcile
  - test_in_flight_without_timestamp_ghost_cleared
  - test_stale_legacy_row_ghost_cleared
rules:
  forbidden:
  - skip reconcile because receipts look idle
  - reconcile failure proves running
  - parent active when all children terminal
  - ghost or stale in_flight survives reconcile
  fixtures:
  - ghost_inflight
  - fanout_parent_terminal_children
  precedence:
  - pre_read mandatory before Run reads and board refresh
  - terminal children must close fanout parent
  - live PID rows skip ghost clear
  - max_age abandon is hygiene not lane failure
  - L3 handler is repair not pre-read bypass
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  acceptance:
  - test_launch_registry_reconcile green
  - reconcile_launch_registry returns structured outcome
  - post-reconcile idle when no live momentum
  - conceptual_confirmed_at set
  maintainer_invocation: 'MAINTAIN OPERATOR SURFACE

    trinity_id: launch_registry_reconcile

    concept: launch_registry_reconcile

    serve: registry pre-read before Run

    forbidden: skip reconcile, ghost survives

    gate: reconcile_launch_registry before activity reads

    '
contract:
  proof:
  - scripts/eat_queue_core/launch_registry_reconcile.py
  - scripts/eat_queue_core/tests/test_launch_registry_reconcile.py
  - scripts/eat_queue_core/recoverable_handlers.py
  invariant_ids:
  - registry_reconcile_pre_read
