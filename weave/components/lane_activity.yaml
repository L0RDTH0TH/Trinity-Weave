id: lane_activity
conceptual:
  outcome: resolve_lane_activity is the single authority for the Run axis (paused
    | idle | running). After mandatory pre-read reconcile, it classifies liveness
    from registry, monitor, and orchestration — and from pq.lock only when it represents
    active forward momentum, not a block. Receipt history never sets Run.
  summary: Single authority for the Run axis after mandatory pre-read reconcile. running
    means forward momentum — a blocking lock without active eat is idle, not running.
    Serves operator trust on the board Run column; Health is computed elsewhere.
  primary_case: You glance at the board on your phone. The Run badge should mean the
    lane is actually moving — not receipt tail, not a stale mutex, not historical
    in_flight. After reconcile, each lane gets run_status plus focus and why you can
    act on.
  edge_cases:
  - 'paused: policy or manual stall overrides all — immediate paused.'
  - 'running: requires forward momentum — live registry, monitor, or orchestration
    after reconcile; pq.lock counts only when holder indicates active queue consumption
    (not block-only wait).'
  - 'idle: no live momentum signals; stale/dead pq.lock cleared — not running.'
  - 'Orthogonal to Health: unhealthy lane can run; healthy lane can be paused.'
  - Registry/monitor/orchestration assumed live signals imply momentum when reconciled
    — not block-only.
  misread_risks:
  - Last receipt ok or receipt tail → Run.
  - pq.lock with live PID but no forward progress → running.
  - Monitor in_flight or registry row without reconcile/liveness → running.
  - Collapsing Run with Health or queue depth.
  - Board or kernel re-implements Run instead of calling this resolver.
  operator_trust: Wrong Run on the remote board breaks trust faster than wrong Health.
    running must mean the lane is working, not stuck behind a lock. Touch and Rules
    enforce this semantics; implementation must not treat block-only locks as running.
  refs:
  - '[[3-Resources/Second-Brain/Docs/Operator-Surface-Maintenance-Spec]]'
  - '[[3-Resources/Second-Brain/Docs/Lane-Status-Board-Rules]]'
  - '[[3-Resources/Second-Brain/Docs/Component-Trinity]]'
  - '[[.technical/weave/components/lane_status_board.yaml]]'
  operator_memory_hook: Run means momentum, not history.
