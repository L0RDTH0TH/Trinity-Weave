  - scripts/eat_queue_core/lane_status_board.py
  queue_modes:
  - OPERATOR_SURFACE_REPAIR
  - MAINTAIN OPERATOR SURFACE
  behavior_signals:
  - test_block_only_pq_lock_not_running
  - test_maintenance_idle_after_reconcile
  - test_operator_cancelled_not_running
  - test_in_flight_without_timestamp_ghost_cleared
  - test_clear_stale_lock_skips_live_holder
  - test_paused_policy_run_paused
rules:
  forbidden:
  - receipt or history implies Run
  - block-only pq.lock implies running
  - monitor or registry without reconcile implies running
  - health and Run collapsed
  - second Run classifier outside this module
  - System must not auto-mutate this maintenance-core card (operator --operator-mutation
    only).
  fixtures:
  - ghost_inflight
  - receipt_success_only
  - paused_policy
  - stale_lock_cleared
  precedence:
  - 'pre_read: reconcile_launch_registry before classify'
  - 'paused: policy + manual stall override all'
  - 'running: forward momentum only — live registry, monitor, orchestration; lock
    only if active eat'
  - 'idle: default when no momentum'
  - kernel + board call this resolver — no re-implement
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  acceptance:
  - test_launch_registry_reconcile + test_goal_authority_io green
  - resolve_lane_activity returns paused|idle|running
  - stale lock cleared without false running
  - conceptual_confirmed_at set
  maintainer_invocation: 'MAINTAIN OPERATOR SURFACE

    trinity_id: lane_activity

    concept: lane_activity

    serve: Run axis + forward momentum

    forbidden: receipt→run, block-only lock→running

    gate: resolve_lane_activity + reconcile pre-read

    '
