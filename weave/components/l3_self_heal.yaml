id: l3_self_heal
conceptual:
  outcome: When a stall is recoverable, orchestration runs in a fixed order so closure
    is attempted before spin resumes.
  summary: L3 owns the ordered closure recipe after recoverability is established
    — not the handler catalog, not the board. Preconditions, anti-spin, mapped reconciliation,
    post-heal verification, and momentum checks run in sequence; skipping steps is
    forbidden.
  primary_case: A lane stalled but the fault class is recoverable. You expect one
    disciplined cycle — mapped reconciliation, honest operator surface, restored momentum
    — or escalation instead of circling.
  edge_cases:
  - L3 disabled → no auto orchestration; stall and ticket remain.
  - Lane or handler outside rollout phase → skip auto orchestration.
  - Same stall fingerprint → skip repeat closure (anti-spin).
  - max L3 attempts per stall → stop auto orchestration for that stall.
  - Post-heal verifier fail → human_gate when auto_rollback configured.
  - eat_retry false (drills) → handler and verify only; lane retry skipped; partial
    closure path.
  - eat_retry true (production default) → lane retry required for full closure.
  misread_risks:
  - Treat L3 as recoverability classification — trinity_id recoverable_handlers owns
    that.
  - Recovery roulette or retry until lucky.
  - Handler ok equals stall closed without verify or lane retry.
  - Repeat closure without new evidence.
  - Verifier fail treated as soft success.
  operator_trust: 'Operator sees rollout, last heal, and attempts on the board L3
    section — auto closure is visible and bounded, not hidden loops.

    '
  refs:
  - '[[3-Resources/Second-Brain/Docs/Weave-L3-Self-Healing]]'
  - '[[3-Resources/Second-Brain/Docs/Lane-Recovery-and-Recoverable-Codes]]'
  - '[[3-Resources/Second-Brain/Docs/Component-Trinity]]'
  - '[[.technical/weave/components/recoverable_handlers.yaml]]'
  - '[[.technical/weave/components/lane_status_board.yaml]]'
  operator_memory_hook: Recoverable stall → ordered closure, not spin.
