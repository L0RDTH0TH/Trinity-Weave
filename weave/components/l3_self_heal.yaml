rules:
  forbidden:
  - classify recoverability inside L3
  - recovery roulette or unbounded retry
  - repeat closure without new evidence
  - claim closure on handler ok alone
  - skip post_heal_verify when required
  fixtures:
  - f2_blocks_sandbox_auto_heal
  - f4_permits_all_lanes
  precedence:
  - preconditions recoverable retry eligible rollout permit
  - anti_spin new_evidence_for_retry
  - execute mapped reconciliation via recoverable_handlers
  - post_heal_verify operator surface
  - headless_eat lane retry when eat_retry true
  - record metric apply caps
  - escalate human_gate or true_stop on closure fail
  - 'policy: skip lane retry in production auto-heal when eat_retry enabled'
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  acceptance:
  - test_weave_l3 green
  - l3 board section present in REQUIRED_SECTIONS
  - metrics append l3_self_heal rows
  maintainer_invocation: 'MAINTAIN OPERATOR SURFACE

