id: l2_symbolic_conflict
conceptual:
  outcome: Before meaningful automated work proceeds, the weave can ask whether the
    planned action still fits shared law.
  summary: 'L2 pause: compare imminent action against registered invariants. Aligned
    — continue within bounds. Mismatch — narrow scope, escalate, or stop when severity
    demands. Works with predictive maintenance and recovery orchestration; does not
    replace them.'
  primary_case: A run is about to change something that matters. You expect a quick
    coherence check — if the move fits shared law, work continues; if not, a clear
    stop or review path instead of silent drift.
  edge_cases:
  - If this layer is turned off, work may continue while still recording what would
    have been flagged.
  - If shared law has not been seeded yet, checks may pass by default until law is
    established.
  - Some mismatches are warnings first; higher-risk mismatches become hard stops.
  misread_risks:
  - Treating this as the place to invent new rules instead of using the registry.
  - Assuming a pass means everything is perfect, even when enforcement is in observe
    mode.
  - Skipping the check because speed feels more important in the moment.
  operator_memory_hook: 'Before action: does this still match our shared law?'
  spine_ordinal: 2
  set: governance_pyramid
  polar_pair: invariant_registry — registry states shared law; this step checks behavior
    against it.
  pairs_with: invariant_registry, recoverable_handlers, l2_predictive_maintenance
touch:
  primary_paths:
  - scripts/eat_queue_core/weave/symbolic_conflict.py
  inbound:
  - invariant_registry active entries
  - gate_symbolic_action from maintenance and recoverable paths
  - risk_tier from caller context
  outbound:
  - ConflictDecision (proceed | block | needs_human_resolution)
  - symbolic board section on lane status board
  - weave metrics symbolic_conflict rows
  behavior_signals:
  - test_bootstrap_n2_creates_invariants
  - test_medium_invariant_requires_counselor
  - test_forbidden_flag_blocks_when_enforced
  - test_clean_context_proceeds
rules:
  forbidden:
  - register new shared law in symbolic_conflict instead of invariant_registry
  - bypass gate_symbolic_action on recoverable paths when symbolic enforcement is
    active
  - System must not auto-mutate this maintenance-core card (operator --operator-mutation
    only).
  fixtures: []
  precedence:
  - load active invariants from apex registry before evaluate
  - apply tier-aware policy to raw violation severity
  - honor observe_only vs enforcement_enabled from config
  - log decision to governance metrics
  - 'policy: treat stub_mode proceed as proof of law compliance'
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  acceptance:
  - test_weave_symbolic green
  - test_l2_validation_drill gate paths
contract:
  proof:
  - scripts/eat_queue_core/weave/symbolic_conflict.py
  - scripts/eat_queue_core/tests/test_weave_symbolic.py
  - scripts/eat_queue_core/weave/l2_validation_drill.py
  invariant_ids: []
