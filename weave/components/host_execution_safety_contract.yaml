conceptual:
  outcome: Destructive vault work is allowed only through explicit operational gates — backup, snapshot,
    confidence band, and delete-to-trash — not through host rule sprawl or narrative confidence.
  summary: '**Inert roots** (`4-Archives/`, `.trash/`, `.backups/`): reference-only and **not executable**
    — never import/run code or invoke scripts resident there; reads allowed; reactivate only by moving
    out first. Cross-ref [[vault_layout_naming_doctrine]] (Archives = inactive/inert). This meta card
    is the execution safety contract for all hosts and pipelines: how destructive work may proceed, distinct
    from maintenance_honesty_anchor (whether success claims are structurally honest). It distills the
    worth keeping from archived Cursor rules (20260606T055949Z) into Trinity engine law. Gates: (1) backup
    before destructive batch or stale gap; (2) per-change snapshot + high confidence band before destructive
    step; (3) mid-band = one non-destructive loop only, decay on flat/decrease; (4) low-band = proposals/wrappers,
    no destructive; (5) delete intent via scripts/move-to-trash.sh to .trash/ — never shell rm or vault
    cp; (6) MCP mutate path = ensure_structure, dry_run move, snapshot, commit; (7) protected paths never
    autonomously moved/deleted; (8) post-edit curator_snapshot.sh tail before Success; (9) MCP-less hosts
    apply same gates best-effort via inline file tools. Not a full MCP catalog or routing table — those
    stay on factory cards and harness_runtime_contract. First host-weld/live/safety.md mint = surgical
    digest of this card.'
  primary_case: 'Ingest proposes moving a note at 82% confidence. Safety contract: mid-band triggers one
    non-destructive refinement loop; no move until post_loop_conf >= 85% and snapshot succeeds. Agent
    tries rm on vault file — forbidden; use move-to-trash. Session mutates vault files — curator_snapshot
    before reporting Success. Backup create fails — abort destructive steps, log #review-needed, continue
    batch.'
  secondary_case: Task subagent without obsidian_* tools may edit .md inline but must treat confidence
    bands and snapshot intent as conceptual gates; shell rm/cp remain forbidden.
  edge_cases:
  - Frozen conceptual roadmap — dual-track blocks destructive MCP on frozen notes
  - Large batch — batch snapshot dir when over batch_size_for_snapshot
  - GitForge public export — never ad-hoc push from vault; Curator tail is separate
  - Watcher-Result I/O failure — Errors.md fallback; do not block queue
  - 'Roadmap state corrupt — abort pipeline with #state-corrupt'
  - Code under 4-Archives/.trash/.backups is inert — do not PYTHONPATH/import/exec; move to live first.
  misread_risks:
  - Duplicating maintenance_honesty_anchor — honesty classifies claims; safety authorizes mutations
  - Pasting full core-guardrails into host-weld — digest only
  - Weakening gates when MCP unavailable — best-effort is not skip bands
  - Import-only smoke as structural green — conduct/honesty govern proof
  - Replacing Subagent-Safety-Contract body — pointer on Touch only
  frame_anchor: Execution safety — backup, snapshot, bands, trash, protected paths, curator tail.
  operator_memory_hook: High band + snapshot before destructive; trash not rm; backup tail before Success.
  refs:
  - '[[3-Resources/Second-Brain/Docs/Safety-Invariants]]'
