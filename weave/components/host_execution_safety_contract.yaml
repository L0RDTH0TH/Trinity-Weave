touch:
  primary_paths:
  - scripts/move-to-trash.sh
  - scripts/curator_snapshot.sh
  - .cursor/skills/obsidian-snapshot/SKILL.md
  - 3-Resources/Second-Brain/Parameters.md
  - 3-Resources/Second-Brain-Config.md
  distill_archive_root: 4-Archives/Resources/Second-Brain-Host-Weld-Legacy/20260606T055949Z
  host_weld_live_target: .technical/weave/host-weld/live/safety.md
  safety_contract_pointers:
  - 3-Resources/Second-Brain/Subagent-Safety-Contract.md
  confidence_bands:
    high_threshold_default: 85
    mid_band_default:
    - 68
    - 84
  protected_path_globs:
  - Backups/**
  - 3-Resources/Watcher-Signal.md
  - 3-Resources/Watcher-Result.md
  - Ingest/watched-file.md
  snapshot_roots:
    external: BACKUP_DIR
    per_change: Backups/Per-Change
    batch: Backups/Batch
  delete_policy: move_to_trash_only
  curator_tail_script: scripts/curator_snapshot.sh
rules:
  forbidden:
  - destructive_action_without_high_band_and_snapshot
  - shell_rm_rmdir_find_delete_on_vault
  - shell_cp_to_mutate_vault_content
  - autonomous_move_rename_delete_on_protected_paths
  - overwrite_backups_or_snapshot_dirs
  - claim_success_when_curator_snapshot_failed
  - skip_dry_run_before_obsidian_move_note
  - advance_roadmap_current_phase_when_prior_phases_below_threshold
  - paste_full_subagent_safety_contract_into_meta_body
  - execute_or_import_code_resident_under_inert_root
  precedence:
  - inert_roots_are_reference_only_never_executed
  - protected_paths_and_trash_policy_are_non_negotiable
  - backup_before_destructive_batch_or_stale_gap
  - high_band_plus_per_change_snapshot_before_destructive_step
  - mid_band_at_most_one_non_destructive_loop_per_note_per_run
  - post_loop_conf_decay_falls_back_to_user_decision_no_destructive
  - mcp_less_hosts_best_effort_same_intent_no_shell_rm_cp
  - curator_snapshot_before_success_report_after_vault_mutation
  - honesty_anchor_governs_claim_tiers_not_mutation_authorization
  - harness_runtime_contract_governs_layer_dispatch_not_file_gates
  destructive_gate:
    requires:
    - confidence_in_high_band
    - per_change_snapshot_ok
    backup_gate:
      prefer: obsidian_ensure_backup
      create_when_missing: obsidian_create_backup
      abort_destructive_on_failure: true
    move_gate:
    - obsidian_ensure_structure
    - obsidian_move_note_dry_run
    - per_change_snapshot
    - obsidian_move_note_commit
    delete_gate:
    - move_to_trash_script_only
    - operator_only_empty_trash
  error_on_gate_failure:
    log: 3-Resources/Errors.md
    flag: '#review-needed'
    wrapper: Ingest/Decisions/Errors/
  acceptance:
  - All autonomous pipelines honor shared confidence bands from Parameters/Config
  - No destructive MCP or inline destructive edit without high band + snapshot success
  - Delete intent uses move-to-trash manifest path only
  fixtures: []
