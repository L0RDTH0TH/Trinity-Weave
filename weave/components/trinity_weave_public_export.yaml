id: trinity_weave_public_export
conceptual:
  outcome: Trinity-Weave receives a deterministic, allowlisted weave slice — code, locked meta, host-weld law, design docs
    — with hard guards against factory/project file bleed.
  summary: 'This meta card binds the **Trinity-Weave** public repo ([L0RDTH0TH/Trinity-Weave](https://github.com/L0RDTH0TH/Trinity-Weave))
    to harness **weave_public_sync** / **post_queue_weave_publish**. Light Phase 18 distribution: filled maintenance meta,
    weave Python, host-weld live/, constitution/manifest docs. **Forbidden:** all project factory output (1-Projects, Roadmap,
    Ingest, parallel runtime, component-proposals). Config **`weave_publish`** in Second-Brain-Config is the operator knob;
    export contract below is normative.'
  primary_case: Operator runs `PYTHONPATH=scripts python3 -m scripts.eat_queue_core.harness weave_public_sync --vault-root
    .` (optional `--push`). Module rsyncs allowlisted paths to `weave_publish.export_repo_root`, runs forbidden-prefix scan,
    commits, pushes to `main`. Grok GitHub link attaches this repo for weave architecture questions.
  secondary_case: 'Extend allowlist for new locked meta or weave module: update export_contract in Config + this card touch
    paths + Weave-Core-Manifest + test fixtures. Re-run sync; never widen to project trees.'
  edge_cases:
  - weave_publish.enabled false — skip with audit.
  - export_repo_root missing — fail with setup hint.
  - push dry-run only — --no-push for local verify.
  misread_risks:
  - Using GitForge integration sync for Trinity-Weave.
  - Including .cursor/rules bulk archive in weave public.
  - Shipping provisional component-proposals.
  frame_anchor: Trinity-Weave export harness (primary); extend allowlist with tests (secondary).
  operator_memory_hook: weave_public_sync → Trinity-Weave; projects stay off.
  refs:
  - '[[3-Resources/Second-Brain/Docs/Weave-Core-Manifest]]'
  - '[[.technical/weave/components/public_surface_topology.yaml]]'
  - '[[3-Resources/Second-Brain/Second-Brain-Config]]'
touch:
  primary_paths:
  - scripts/eat_queue_core/weave_public_publish.py
  - scripts/eat_queue_core/post_queue_weave_publish.py
  - scripts/eat_queue_core/harness.py
  - 3-Resources/Second-Brain/Docs/Trinity-Weave-Export-README.md
  inbound:
  - weave_public_sync
  - post_queue_weave_publish
  - maintain_wrap cadence optional tail
  outbound:
  - https://github.com/L0RDTH0TH/Trinity-Weave
  harness_commands:
  - weave_public_sync
  - post_queue_weave_publish
rules:
  forbidden:
  - any path under 1-Projects/, 2-Areas/, Ingest/, Roadmap/, 4-Archives/, 5-Attachments/
  - .technical/parallel/
  - .technical/weave/component-proposals/
  - absolute machine paths in committed README
  - vault_backup or curator remote URLs in export tree
  precedence:
  - allowlist-only copy — deny by default
  - forbidden scan after sync before git add
  - pairs_with public_surface_topology for surface doctrine
  acceptance:
  - test_weave_public_publish green
  - Weave-Core-Manifest lists shipped ids
  fixtures: []
contract:
  proof:
  - scripts/eat_queue_core/tests/test_weave_public_publish.py
  - scripts/eat_queue_core/weave_public_publish.py
  invariant_ids:
  - weave_public_no_project_bleed
