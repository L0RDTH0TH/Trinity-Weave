id: persona_atlas
conceptual:
  outcome: One atlas tells you which Layer 0 voice owns a factory launch — Architect,
    Curator, or neutral Weave downstream — so personas do not sprawl into duplicate
    cards or crossed STESM.
  summary: This meta card **indexes personas and boundaries** — not one Trinity card
    per persona. **Architect** — overnight goals, goal-authority packet, council,
    headless fanout, project-lane orchestration prep; **not** museum capture-only.
    **Curator Agent** — chat-first museum/librarian capture, institute lane STESM,
    voice modes; **not** open-ended goal ownership. **The Weave** — software (harness,
    queue, receipts); **neutral** in L1/L2 telemetry; never called 'Curator'. Pipeline
    subagents (ingest, roadmap, …) are **Layer 2 executors**, not chat personas. **Primary
    (steady meta):** you **launch a factory** and pick (or the funnel picks) the **right
    persona** for Layer 0 — then hand off to runtime (#2) and adapter (#3). **Secondary
    (meta evolution):** a **new factory** or **philosophy shift** (swarms, merged
    persona, new voice) — cards show which persona boundaries move, which `architect_*`
    / curator cards consolidate here vs stay component legs.
  primary_case: 'Steady state under this meta: you **launch a factory** and need the
    correct **Layer 0 face**. Overnight sandbox goal → **Architect** (packet, council
    optional, headless — not inline deepen). Museum capture, exhibit, institute ingest
    → **Curator** (PQ prep, `lane institute`, persona voice in report only). Project
    roadmap EAT-QUEUE on godot/sandbox → operator phrase or **Architect** prep, then
    **Task(queue)** — **Weave** executes; chat does not play Layer 1. You read this
    atlas (and linked voice docs) instead of opening ten `architect_*` cards to guess
    who speaks.'
  secondary_case: 'Meta evolution planning: you add a **new factory** or shift **who
    speaks when** — e.g. agent swarms, a third Layer 0 persona, or collapsing `architect_*`
    provisionals into one spawn pattern. The agent uses this atlas plus indexed cards.
    **Locked fit** — which persona rules and agent files already apply. **Output shifts**
    — who prepends PQ, which lane, voice in chat vs neutral Watcher. **Ripples:**
    change **A** (persona ownership) for **C** (swarm) → **D** (dispatcher funnel,
    context_envelope, goal packet shield); **B** avoid (Curator owning overnight packet,
    Architect doing museum STESM, calling Weave ''Curator''); **E** enhance (atlas
    Touch index, USER.md persona card, consolidate architect cluster under one spawn
    card). Product factories (roadmap, ingest) are examples only.'
  edge_cases:
  - Architect packet mode — goal-authority JSON only; no inline queue consume (shield
    rule).
  - Curator STESM — prep institute PQ + same-turn Task(queue); lane curator invalid
    — use institute.
  - EAT-QUEUE godot/sandbox — dispatcher; not Curator replacement.
  - Layer 2 pipeline agents — neutral voice; persona atlas cites them as executors
    not L0 faces.
  - architect_* provisionals (10) — indexed here; promote as components when factory
    legs mature.
  - Council seats — Feature Council; Architect merges; not separate chat personas
    in atlas.
  misread_risks:
  - One Trinity card per persona — atlas indexes; component cards hold legs.
  - Primary as 'user says ingest' phrase list — primary is factory launch + correct
    L0 persona.
  - Secondary tied to one factory name — any new factory or persona philosophy shift.
  - Curator = the Weave software — use Curator vs Weave doc.
  - Architect doing capture STESM — route Curator.
  - Skipping persona check before Layer 0 factory launch.
  - Mesh without ripples, shifts, E, B.
  frame_anchor: Who speaks at Layer 0 when factories launch (primary); how persona
    boundaries evolve (secondary).
  operator_memory_hook: Architect owns goals; Curator owns capture; Weave runs neutral;
    atlas indexes the rest.
  refs:
  - '[[3-Resources/Second-Brain/Docs/Curator-Agent]]'
  - '[[3-Resources/Second-Brain/Docs/Curator-Persona-Voice]]'
  - '[[3-Resources/Second-Brain/Docs/Curator-Software-vs-Agent]]'
  - '[[3-Resources/Second-Brain/Docs/Goal-Authority-Spec]]'
  - '[[3-Resources/Second-Brain/Docs/Architect-Intent-Thread]]'
  - '[[3-Resources/Second-Brain/Docs/Council-Seat-Precedence]]'
  - '[[3-Resources/Second-Brain/Docs/Maintenance-Trinity-Constitution]]'
  - '[[.cursor/rules/always/host-weld-bridge]]'
  - '[[.cursor/agents/architect.md]]'
  - '[[.technical/weave/components/cursor_host_adapter.yaml]]'
