  - 4-Archives/Resources/Second-Brain-Host-Weld-Legacy/20260606T055949Z/always/architect-goal-packet-shield.mdc
  persona_index:
    layer_0:
      architect:
        rule: .cursor/rules/context/architect-agent.mdc
        agent: .cursor/agents/architect.md
        owns:
        - goal packet
        - council
        - headless fanout
        - overnight
        - multi-lane prep
        not:
        - museum capture STESM
        - institute-only ingest
        related_provisionals:
        - architect_action_plan
        - architect_brief
        - architect_fanout_recovery
        - architect_goal_completion
        - architect_ingest_pickup
        - architect_lane_hold
        - architect_orchestration
        - architect_pq_planner
        - architect_preflight
        - architect_touch_apply
      curator_agent:
        rule: .cursor/rules/context/curator-agent.mdc
        agent: persona-only (no .cursor/agents/curator.md)
        owns:
        - capture
        - museum
        - institute lane STESM
        - voice_mode in context_envelope
        not:
        - goal authority packet
        - EAT-QUEUE godot/sandbox replacement
        lane: institute
      weave_software:
        note: The Weave — harness/queue/receipts; neutral L1/L2; see Curator-Software-vs-Agent
        agent: .cursor/agents/technical-weave.md
        not_a_chat_persona: true
    layer_2_executors:
    - ingest
    - roadmap
    - distill
    - express
    - archive
    - organize
    - research
    - validator
  inbound:
  - factory launch — which persona? (primary_case)
  - new factory or persona/swarm philosophy plan (secondary_case)
  - operator ambiguous capture vs overnight goal
  outbound:
  - 'primary: route to architect-agent | curator-agent | dispatcher phrase'
  - 'secondary: mesh report — persona ripples | output shifts | A→D | E | B'
  - context_envelope voice_mode when Curator hands off
  - goal-authority path when Architect hands off
  behavior_signals:
  - test_curator_alias_maps_to_institute_skip
  - test_write_architect_brief
  - test_default_curator_micro_workflow
  - test_spawn_child_blocks_when_architect_preflight_blocks
rules:
  forbidden:
  - new Layer 0 persona without atlas index update
  - call the Weave software Curator in operator-facing copy
  - Architect inline museum STESM or Curator goal packet ownership
  - one card per persona as A-meta substitute for this atlas
  fixtures: []
  precedence:
  - 'primary_case: classify factory launch → Architect | Curator | operator EAT-QUEUE
    phrase before Layer 0 acts'
  - 'primary_case: L1/L2 remain voice-neutral; persona voice in chat reports only
    (Curator)'
  - 'secondary_case: persona boundary changes → mesh + update persona_index; consolidate
    architect_* not multiply A-meta'
  - overnight / council / goal packet → Architect + shield; capture → Curator + institute
  - pipeline Task agents are executors — index only; not L0 persona competition
  - 'policy: route overnight to Curator or capture to Architect without atlas check'
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  acceptance:
  - test_curator_alias_maps_to_institute_skip green
  - test_write_architect_brief green
  - test_spawn_child_blocks_when_architect_preflight_blocks green
