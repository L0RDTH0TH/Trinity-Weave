  inbound:
  - factory launch from Cursor chat (primary_case)
  - EAT-QUEUE / PROCESS TASK QUEUE / mode phrases (system-funnels)
  - new factory or swarm/host philosophy plan (secondary_case)
  outbound:
  - Task(subagent_type) with hand-off prompt + task_harden_metadata
  - .technical/task-handoff-comms.jsonl (and per-track mirror when parallel)
  - 'Task(subagent_type: queue) → harness + Layer 1 per harness_runtime_contract'
  - 'secondary: mesh report — locked fit | output shifts | ripple | enhance E | avoid
    B'
  - 3-Resources/Watcher-Result.md (via Layer 1; parent does not substitute)
  behavior_signals:
  - test_build_handoff_godot_lane
  - test_handoff_includes_context_envelope
  - test_envelope_includes_trinity_pack_for_maintenance_handoff
  - test_json_roundtrip_handoff
rules:
  forbidden:
  - Layer 0 inline queue orchestration when EAT-QUEUE or PROCESS TASK QUEUE triggered
  - 'model: inherit on Task tool arguments'
  - nested pipeline helpers calling Task(prompt_craft) or Task(gitforge) — Layer 1
    / harness only
  - Validator or IRA mutating input artifacts beyond explicit output path
  fixtures: []
  precedence:
  - 'primary_case: factory launch → dispatcher → Task harden pass → real Task call
    → handoff_out/return_in when comms enabled'
  - 'primary_case: parent does not report factory success if mandatory Task failed
    (proof-on-failure)'
  - 'secondary_case (meta evolution): mesh adapter + runtime cards; ripple A→D, enhance
    E, avoid B'
  - 'Task model: omit for inherit parent; fast only when intentional; Config model
    for validator types'
  - MCP probe per Subagent-Safety-Contract; inline fallback declared in run_mode /
    ledger
  - architect goal packet / curator STESM — context rules; hand-off may include context_envelope
  - 'policy: skip Task attempt-before-skip for mandatory subagent_type'
  - 'policy: merge Prompt Craft reasoning into user_guidance'
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only;
    provisional bridge D must tunnel_via locked bridge B, not core A.'
  acceptance:
  - test_build_handoff_godot_lane green
  - test_handoff_includes_context_envelope green
  - test_envelope_includes_trinity_pack_for_maintenance_handoff green
contract:
