id: cursor_host_adapter
conceptual:
  outcome: In Cursor, launching a factory means Layer 0 routes through Task, handoffs,
    and MCP-aware subagents — not chat improvising queue bytes or pipeline steps inline.
  summary: 'This meta card is the **swappable host adapter** for today''s **Cursor
    IDE** binding. **`harness_runtime_contract`** (#2) owns host-agnostic factory
    runtime; **`agent_implementation_style`** (#1) owns how agents integrate code
    and cards. **This card** owns: `.cursor/rules`, `.cursor/skills`, `.cursor/agents`,
    **Task harden pass**, **task-handoff-comms**, Obsidian MCP when present, and Layer
    0 dispatcher/funnel routing (EAT-QUEUE → `Task(queue)`, pipeline modes → `Task(ingest|roadmap|…)`).
    **Primary (steady meta):** you **launch a factory from chat** — Architect prep,
    Curator capture, EAT-QUEUE, headless hand-off — Layer 0 builds the hand-off block,
    attempts real `Task` calls, records comms, and does **not** run Layer 1 queue
    logic inline in the parent. **Secondary (meta evolution):** you plan a **new factory**
    or **philosophy shift** (e.g. factories → **agent swarms**, different Layer 0
    launch pattern, slimmer Task graph) — cards show how Cursor binding must change
    vs locked runtime (#2). Future hosts (HostRunner, API) get **new adapter cards**;
    this card stays Cursor-specific. Capability gaps (MCP down → inline edits) are
    declared, not hidden.'
  primary_case: 'Steady state under this meta: you **launch a factory from Cursor**
    — say EAT-QUEUE on a lane, Resume roadmap, Curator institute prep, or Architect
    overnight hand-off. Layer 0 recognizes the funnel, writes **task-handoff-comms**
    when enabled, and **`Task(subagent_type: …)`** with the mandatory hand-off prompt
    (Subagent-Safety-Contract). The child runs harness + pipelines; the parent waits,
    parses `task_harden_result` / ledger / Watcher lines, and does not claim the factory
    finished if Task failed or proof-on-failure was not recorded. `model: fast` only
    when intentional; never `model: inherit` on Task.'
  secondary_case: 'Meta evolution planning: you add a **new factory** or change **how
    Cursor hosts work** — swarms instead of one Task per mode, a new Layer 0 phrase,
    MCP-less-by-default, or a different comms schema. The agent reads this adapter
    card plus **`harness_runtime_contract`** and affected component cards. **Locked
    fit** — which rules, agents, and hand-off blocks already apply. **Output shifts**
    — what operators see in chat vs Watcher, Task failure rates, MCP vs inline paths.
    **Ripples:** change **A** (dispatcher trigger) for **C** (swarm) → **D** (queue.mdc,
    handoff_build, agent files); **B** avoid (Layer 0 inline PQ parse, skipping Task
    attempt-before-skip, Prompt Craft from IRA); **E** enhance (task-handoff-comms
    fields, architect-agent shield, parallel_context in hand-off). Examples are instances;
    the story is any host-binding evolution.'
  edge_cases:
  - Task subagent without obsidian_* — pipeline uses inline path per contract; still
    attempt Task + ledger honesty.
  - ROADMAP_HANDOFF_VALIDATE — Task(validator) with Config model; read-only on inputs.
  - REPAIR CRAFT / PROMPT CRAFT — Layer 0 only; not nested pipeline helper.
  - Dual-track hand-off — parallel_context YAML in Layer 0→1 hand-off; per-track comms
    path.
  - New factory / swarm philosophy — secondary_case before rewriting dispatcher wholesale.
  misread_risks:
  - Primary_case as 'user types INGEST MODE' only — primary is any factory launch
    via Cursor Layer 0.
  - Secondary_case tied to one product factory — secondary is new factory or host
    philosophy shift.
  - Folding harness PQ contract into this card — use harness_runtime_contract.
  - Layer 0 running queue A.0–A.7 inline — violates adapter; use Task(queue).
  - Success without Task attempt or proof-on-failure when helper was mandatory.
  - 'Passing model: inherit on Task payload.'
  - Mesh without ripples, output shifts, E, B.
  frame_anchor: Cursor host binding for factory launch (primary); plan adapter evolution
    (secondary).
  operator_memory_hook: Chat launches factories via Task + handoff; evolve Cursor
    binding with card mesh first.
  refs:
  - '[[3-Resources/Second-Brain/Subagent-Safety-Contract]]'
  - '[[3-Resources/Second-Brain/Docs/Task-Handoff-Comms-Spec]]'
  - '[[3-Resources/Second-Brain/Docs/Subagent-Layers-Reference]]'
  - '[[3-Resources/Second-Brain/Docs/Rules/Dispatcher-Rule]]'
  - '[[.cursor/rules/always/host-weld-bridge]]'
  - '[[.technical/weave/host-weld/manifest.yaml]]'
  - '[[.technical/weave/host-weld/live/safety.md]]'
  - '[[.cursor/agents/queue.md]]'
  - '[[.technical/weave/components/harness_runtime_contract.yaml]]'
  - '[[.technical/weave/components/agent_implementation_style.yaml]]'
