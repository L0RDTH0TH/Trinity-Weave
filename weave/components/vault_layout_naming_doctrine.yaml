  - .technical/weave/host-weld/manifest.yaml
  - .technical/weave/host-weld/live/safety.md
  - 4-Archives/Resources/Second-Brain-Host-Weld-Legacy/20260606T055949Z/always/second-brain-standards.mdc
  - 4-Archives/Resources/Second-Brain-Host-Weld-Legacy/20260606T055949Z/always/mcp-obsidian-integration.mdc
  - Ingest/
  - 1-Projects/
  - 2-Areas/
  - 3-Resources/
  - 4-Archives/
  - 5-Attachments/
  - .technical/weave/
  path_blacklist:
  - 00 Inbox
  - 10 Zettelkasten
  - 99 Attachments
  - 99 Templates
  protected_globs:
  - Backups/**
  - 3-Resources/Watcher-Signal.md
  - 3-Resources/Watcher-Result.md
  - Ingest/watched-file.md
  inbound:
  - factory launch — where do outputs go? (primary_case)
  - new factory paths or layout philosophy plan (secondary_case)
  - ingest / organize / archive pipeline path proposals
  outbound:
  - 'primary: PARA paths, slugs, frontmatter on factory artifacts'
  - 'secondary: mesh report — path ripples | operator lookup shifts | A→D | E | B'
  - 4-Archives/ bundles when factory archives corpus
  - Ingest/Decisions/ when low-confidence path
  behavior_signals:
  - test_museum_qr_detect_and_audit
  - test_module_importable
  - test_is_maintenance_mode
rules:
  forbidden:
  - reference or create 00 Inbox, 10 Zettelkasten, 99 Attachments, 99 Templates
  - move/delete Backups/** or watcher-protected paths from pipelines
  - new top-level PARA root without operator Vault-Layout amendment
  fixtures: []
  precedence:
  - 'primary_case: unknown → Ingest/; PARA classify before high-band move; kebab-slug-YYYY-MM-DD-HHMM.md'
  - 'primary_case: frontmatter created, tags, title, para-type / project-id when under PARA'
  - 'primary_case: attachments under 5-Attachments/ with embed links in notes'
  - 'secondary_case (meta evolution): mesh new paths vs Vault-Layout + protected paths before creating
    folders'
  - 'secondary_case: document path ripples in Vault-Layout / Naming-Conventions when operator approves'
  - 'dual roadmap: frozen conceptual → Conceptual-Amendments + Execution mirrors — not in-place overwrite'
  - 'trinity: components/ locked, component-proposals/ provisional, 4-Archives/Weave/ for corpus archive'
  - 'policy: invent blacklist folder names for convenience'
  - 'policy: skip Ingest check on new file tasks'
  - 'policy: Phase 8 dual-lock — automation read/align/gate only; YAML edits operator-only; provisional
    bridge D must tunnel_via locked bridge B, not core A.'
  acceptance:
  - test_museum_qr_detect_and_audit green
  - test_module_importable green (architect_ingest_pickup / Ingest paths)
  - test_is_maintenance_mode green
contract:
