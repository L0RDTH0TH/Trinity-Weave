- id: ux_absent_proxy
  label: Absent-player proxy
  summary: When a player is absent, their PC stays in the shared fiction via a session-policy
    delegate (another player or the DM) who receives that character's controls so
    the DM is not forced to run monsters and the missing PC at once. Table may volunteer
    a delegate, or the DM may propose a vote and players choose who is stuck with
    it; policy is per-session and revocable when the owner returns. This is an agency
    / control envelope under camera-control — not Sensorium (read-only sight) and
    not permanent ownership transfer.
  dimension: player_rail
  ux_axis: agency
  parent_id: ux_camera_control_envelopes
  walk_tier: coverage
  mint_status: proposed
  conceptual_pin: 1-Projects/genesis-mythos-master/Roadmap/User-Story/Actual-Play-Feedstock/moments/BG-P12-institutional-seizure.md
  does_not_mandate:
  - players get free third-person orbit as default
  - DM tools exist only as debug infrastructure
  - envelope exits leave soft residual control or wrong perspective
  - camera modes can become permanent without a restore path
  - players may use WorldCam or MapCam as free exploration seats
  seat: []
  derived_from: actual_play:1-Projects/genesis-mythos-master/Roadmap/User-Story/Actual-Play-Feedstock/moments/BG-P12-institutional-seizure.md
