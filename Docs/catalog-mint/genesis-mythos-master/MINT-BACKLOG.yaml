- id: ux_combat_play_surface
  label: Combat can resolve by authored paths including non-win ends
  dimension: ui_surface
  ux_axis: combat_cast_feedback
  summary: 'Combat is a distinct play surface the whole table enters and exits: combat
    chrome and audio for both seats; authorship menu of ends (fight, disengage/flee,
    parley, stakes, surrender, escape-with-cost, and other legitimate paths); DM gates
    all actions, owns the encounter cast with creature chrome and voice tools, and
    can adjust live values. Movement is a readable terrain-aware envelope. Surface
    consumes pre-compiled rule math from an import/library path. Power band gates
    offer and lasting costs. Not one flee caption and not the full rules-math pack.'
  conceptual_pin: needs pin
  derived_from: series:pmg_capabilities:combat_play_surface
