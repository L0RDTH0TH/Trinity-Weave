- id: ux_early_game
  label: Early play is a power band that gates world and pillar response
  dimension: ui_surface
  ux_axis: agency
  summary: 'Early-game is the low power band for the cast: world access, social audience,
    explore pressure, and combat offer scale to that band. Pillar rhythm follows the
    band rather than a second axis. Not a tutorial plot, not session prep, and not
    a mandatory onboarding fantasy. Mid/end stages own their bands the same way —
    no parallel progression parent.'
  conceptual_pin: needs pin
  derived_from: series:lifecycle:early_game
  ux_family: lifecycle
  status: done
  catalog_face: flows
  experience_mode: early_game
  mode_tier: series
  dnd_pillar: shared
  walk_tier: series
  series_id: lifecycle
  altitude: product_contract
  time_scale: session
  seat:
  - shared_table
  does_not_mandate:
  - the only correct ending is institutional seizure
  - end game must erase player legacies
  alternatives_not_banned:
  - Implicit band (content only) vs visible band indicator
  - Strict gates vs soft advice the DM can override
  - Fast climb out of early vs long stay in band
  - Prep-authored early situations vs mostly emergent within band limits
  series_order: 4
  supplement: false
  coverage_slot: false
  notes: applied:2026-07-30T19:16:52Z power_band_on_stages; receipt=Mint-Receipts/ux_early_game.receipt.yaml
- id: ux_mid_game
  label: Mid play is a power band for lasting pressure and deeper world response
  dimension: ui_surface
  ux_axis: agency
  summary: 'Mid-game is the middle power band: world access, social tier, explore
    stakes, and combat offer scale up with it — including who will engage and what
    costs can stick. Lasting pressure and party authorship are capabilities in this
    band, not one mandated conspiracy or romance skin. Pillar rhythm follows the band.
    Same ownership model as early: stages own the band; no parallel progression parent.'
