- id: ux_player_character_creation
  label: Players can author characters and submit them for DM acceptance into a world
  dimension: session_bootstrap
  ux_axis: session0_identity_art
  summary: 'Player authors and owns a character before and after DM greenlight. Builds
    may be unbound or against a campaign invite (entry into campaign and world); invited
    builds disable banned options from world and campaign configs with overwrite-request
    path. Accept flow: invite → attach → greenlight. Incomplete builds are unfinished
    characters, not a draft type. Background→world proposals stay DM-gated and retconnable.'
  conceptual_pin: needs pin
  derived_from: series:lifecycle:player_character_creation
  ux_family: lifecycle
  status: done
  catalog_face: table
  experience_mode: player_character_creation
  mode_tier: series
  dnd_pillar: shared
  walk_tier: series
  series_id: lifecycle
  altitude: product_contract
  time_scale: campaign
  seat:
  - player
  - shared_table
  does_not_mandate:
  - characters must start with a stolen-agency wound
  - backstory is only flavor text with no play hooks
  - ownership transfers to the DM on greenlight
  - character creation requires a separate draft object type
  - players may only build inside an open campaign invite
  alternatives_not_banned:
  - Unbound build then later invite vs build only into an open invite
  - Hard greenlight vs return-with-notes / overwrite negotiation
  - One-campaign binding vs later invite into another campaign in the same world
  - Minimal builder vs richer chrome after legality is solid
  - Aligned vs divergent world/campaign option sets
  series_order: 2
  supplement: false
  coverage_slot: false
  notes: applied:2026-07-30T07:29:30Z receipt=Mint-Receipts/ux_player_character_creation.receipt.yaml
    l5=scopes/ux_player_character_creation/L5.md
- id: ux_dm_session_prep
  label: DM can prep a session without leaving the collaborative table frame
  dimension: dm_rail
  ux_axis: dm_player_rails
  summary: 'DM authors the next shared session experience in-tool; the system auto-stages
    against the attached world and campaign. Visibility is opt-in: general (whole-table)
    and/or per-player tags; unmarked stays secret. World-hitting edits batch and hand
    off into world-gen on prep complete under the same DM gate and retcon rules. Privileged
    orchestrator seat — not offline admin or invisible infrastructure.'
  conceptual_pin: needs pin
  derived_from: series:lifecycle:dm_session_prep
  ux_family: lifecycle
  status: done
  catalog_face: table
  experience_mode: dm_session_prep
  mode_tier: series
  dnd_pillar: shared
  walk_tier: series
  series_id: lifecycle
  altitude: product_contract
  time_scale: session
  seat:
  - dm_as_player
  - privileged_access
  does_not_mandate:
  - prep must be a separate offline app
  - players never see any prep residue
  - all prep material is public by default
  - prep is a back door around DM gate/retcon on world changes
  - session prep creates or replaces the world or campaign frame
  - visibility is only a single whole-table tag with no per-player option
  alternatives_not_banned:
  - Thin author notes vs rich structured beats (system still stages)
  - Mostly secret with selective reveals vs broader general tags
  - Prep mode distinct vs prep panels on the DM rail during downtime
  - Batch applied on complete vs batch held for DM confirm in world-gen
  series_order: 3
  supplement: false
  coverage_slot: false
  notes: applied:2026-07-30T07:41:00Z amended:2026-07-30T18:37:43Z visibility=general+per-player;
    no char-create exit refrain
