  dimension: ui_surface
  ux_axis: agency
  summary: 'Early-game is the low power band for the cast: world access, social audience,
    explore pressure, and combat offer scale to that band. Pillar rhythm follows the
    band rather than a second axis. Not a tutorial plot, not session prep, and not
    a mandatory onboarding fantasy. Mid/end stages own their bands the same way —
    no parallel progression parent.'
