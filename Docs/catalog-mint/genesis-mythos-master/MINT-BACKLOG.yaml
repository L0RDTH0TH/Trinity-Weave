- id: ux_late_game
  label: Late play is a power band for campaign crescendo, close, and character-to-world
    persistence
  dimension: ui_surface
  ux_axis: agency
  summary: 'Late-game is the high power band: survivors are world-shapers. It covers
    build-up to close and the close itself. DM triggers campaign end through a story
