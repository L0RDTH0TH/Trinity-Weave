- id: ux_collaborative_table_agency
  label: Shared virtual-tabletop loop with character agency and DM orchestration
  dimension: dm_rail
  ux_axis: dm_player_rails
  summary: 'Virtual tabletop for collaborative storytelling: players act through character
    tools in an open 3D world; the DM is the privileged orchestrator in the same product
    loop. Loop is player agency → system and DM resolution → world reacts → roleplay
    inside that structure. Motives/stakes are table-defined and recorded; player speech
    can be transcribed. NPC dialogue is the DM’s responsibility — assist tools surface
    context, they do not replace the DM as speaker by default.'
  conceptual_pin: needs pin
  derived_from: series:pmg_capabilities:collaborative_table_agency
  ux_family: pmg_capabilities
  status: done
  catalog_face: table
  experience_mode: collaborative_table_agency
  mode_tier: series
  dnd_pillar: shared
  walk_tier: series
  series_id: pmg_capabilities
  altitude: product_contract
  time_scale: session
  seat:
  - shared_table
  - dm_as_player
  - privileged_access
  does_not_mandate:
  - DM is only a cue issuer for other players
  - players and DM share identical control envelopes
  - system-owned NPC dialogue is the product default
  - player social play defaults to dialogue-option trees
  - play must be combat-primary / hack-and-slash
  alternatives_not_banned:
  - Combat-heavy tables vs social/explore-primary tables
  - Heavy transcription vs light note capture of player intent
  - Rich NPC context assist vs minimal prompts
  - DM who also runs a character vs DM seat only
