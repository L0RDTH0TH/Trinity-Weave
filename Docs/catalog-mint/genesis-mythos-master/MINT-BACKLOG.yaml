- id: ux_combat_play_surface
  label: Combat can resolve by authored paths including non-win ends
  dimension: ui_surface
  ux_axis: combat_cast_feedback
  summary: 'Combat is a distinct play surface the whole table enters and exits: combat
    chrome and audio for both seats; authorship menu of ends (fight, disengage/flee,
    parley, stakes, surrender, escape-with-cost, and other legitimate paths); DM gates
    all actions, owns the encounter cast with creature chrome and voice tools, and
    can adjust live values. Movement is a readable terrain-aware envelope. Surface
    consumes pre-compiled rule math from an import/library path. Power band gates
    offer and lasting costs. Not one flee caption and not the full rules-math pack.'
  conceptual_pin: needs pin
  derived_from: series:pmg_capabilities:combat_play_surface
  ux_family: pmg_capabilities
  status: done
  catalog_face: inhabit
  experience_mode: combat_play_surface
  mode_tier: series
  dnd_pillar: combat
  walk_tier: series
  series_id: pmg_capabilities
  altitude: product_contract
  time_scale: moment
  seat:
  - shared_table
  does_not_mandate:
  - flee is the only correct authored end
  - combat always resolves to XP loot chrome
  - combat is a single win/lose elimination pipeline
  - DM only adjudicates and never inhabits creature roles
  - player and DM share identical combat control envelopes
  alternatives_not_banned:
  - Lethal-default tables vs non-lethal-friendly tables
  - Flee with chase vs clean disengage
  - Parley mid-fight vs only before blows land
  - Sparse authored ends vs many stake levers
  - XP/loot present vs progression mostly elsewhere
  - Heavy vs light creature chrome in early builds
  - System-default music only vs frequent DM-queued tracks
  series_order: 2
  supplement: false
  coverage_slot: false
  notes: applied:2026-07-31T03:34:21Z poc=fight+flee+parley; either opens non-win;
    receipt=Mint-Receipts/ux_combat_play_surface.receipt.yaml
- id: ux_camera_control_envelopes
  label: Perspective and control envelopes can change and cleanly return
  dimension: player_rail
  ux_axis: perspective_overrides
  summary: 'Baseline player FP and a set of explicit temporary envelopes that change
    perspective and/or control then hard-restore. Overrides (scry/divination, dominate,
    liminal/unconscious, planar/gate, absent-proxy, etc.) always return to baseline
    FP or the declared prior state. DM rail is first-class in the same parent: WorldCam
    is the DM default; MapCam, Sensorium Attach, and DM pilot are explicit departures
    with hard restore. Players never use WorldCam/MapCam. Every enter declares controller,
    presentation, duration, and return target.'
  conceptual_pin: needs pin
  derived_from: series:pmg_capabilities:camera_control_envelopes
  ux_family: pmg_capabilities
  status: done
