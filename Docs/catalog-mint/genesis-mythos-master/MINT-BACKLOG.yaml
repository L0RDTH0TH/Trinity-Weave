  dimension: world_gen
  ux_axis: session0_identity_art
  summary: Durable world container — DM creates initial form via wizard+preview (tone-aware
    shape families, cached/pre-existing assets); table can shape; players do not author
    the first world. Physical/settlement layers + monster-region tags; import/attach
    first-class; every world-hitting change is DM-retconnable. Multiple campaigns/casts
    attach to the same world.
  conceptual_pin: needs pin
  derived_from: series:lifecycle:world_generation
