- id: ux_world_generation
  label: DM can create (table can shape) a persistent living world
  dimension: world_gen
  ux_axis: session0_identity_art
  summary: Durable world container — DM creates initial form via wizard+preview; table
    can shape; players do not author the first world. Physical/settlement layers +
    monster-region tags; import/attach; DM retcon on any world-hitting change.
  conceptual_pin: needs pin
  derived_from: series:lifecycle:world_generation
  ux_family: lifecycle
  status: done
  catalog_face: living_world
  experience_mode: world_generation
  mode_tier: series
  dnd_pillar: shared
  walk_tier: series
  series_id: lifecycle
  altitude: product_contract
  time_scale: world_era
  seat:
  - shared_table
  - dm_as_player
  - privileged_access
  does_not_mandate:
  - one world equals exactly one campaign forever
  - worldgen is only a Session 0 checkbox with no persistent container
  - players author the first world
  - world create forces unconstrained multi-knob fresh-noise every time
  - world creation's default next step is player character creation
  alternatives_not_banned:
  - Nth campaign in a long-lived world vs first campaign in a newly wizard-created
    world
  - Thin shape+preview accept vs deeper multi-step wizard on first create
  - Import vs in-tool wizard-create only
  - World empty of campaigns vs world carrying prior scars/legacies
  - Directional world-tone × campaign-tone combinations
  - Adaptation heavy vs light (still always DM-gated and retconnable)
  series_order: 0
